<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>挞飞 · 站长后台</title>
<link rel="stylesheet" href="css/tafei-ui.css">
<style>
  :root{color-scheme:dark light}
  body{margin:0;padding:20px 14px 70px;color:var(--tf-text,#eef4ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1100px 520px at 12% -6%,rgba(70,120,255,.16),transparent 62%),radial-gradient(900px 480px at 92% 4%,rgba(132,107,255,.14),transparent 60%) fixed,var(--tf-bg,#0b1220)}
  body.light{background:#eef4ff;color:#15213b}
  main{max-width:960px;margin:0 auto}
  .kicker{color:var(--tf-cyan,#64e8ff);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  h1{margin:8px 0 6px;font-size:27px;letter-spacing:-.01em}
  .lead{color:var(--tf-muted,#9aaccb);font-size:13.5px;line-height:1.7;margin:0 0 16px}
  .card{background:var(--tf-panel,rgba(16,25,48,.78));border:1px solid var(--tf-line,rgba(130,170,255,.18));border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 12px 32px rgba(4,10,25,.28)}
  body.light .card{background:#fff;border-color:#d7e3f7;box-shadow:0 10px 24px rgba(29,58,110,.08)}
  h2{margin:0 0 12px;font-size:16px}
  label{display:block;margin:10px 0 5px;font-size:12.5px;color:var(--tf-muted,#9aaccb)}
  input,select,textarea{width:100%;box-sizing:border-box;min-height:42px;padding:0 12px;border-radius:12px;font:inherit;font-size:14px;
    border:1px solid var(--tf-line,rgba(130,170,255,.18));background:var(--tf-panel2,#111d37);color:inherit;outline:none}
  textarea{min-height:88px;padding:10px 12px;line-height:1.65;resize:vertical}
  body.light input,body.light select,body.light textarea{background:#f6f9ff;color:#15213b;border-color:#cfdff5}
  input:focus,select:focus,textarea:focus{border-color:var(--tf-cyan,#64e8ff);box-shadow:0 0 0 3px rgba(100,232,255,.22)}
  button{min-height:42px;padding:0 16px;margin-top:10px;cursor:pointer;border:0;border-radius:12px;font:inherit;font-size:14px;font-weight:600;color:#fff;
    background:linear-gradient(110deg,#3b8fff,#846bff)}
  button.ghost{background:transparent;color:var(--tf-muted,#9aaccb);border:1px solid var(--tf-line,rgba(130,170,255,.18));font-weight:500}
  button.mini{min-height:32px;padding:0 11px;font-size:12.5px;margin:0}
  button.danger{background:transparent;color:#ff9d9d;border:1px solid rgba(255,120,120,.35);font-weight:500}
  body.light button.ghost{color:#5d729a;border-color:#cfdff5}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin:10px 0 0;font-size:13px;color:var(--tf-muted,#9aaccb);min-height:18px}
  .msg.err{color:#ff8f8f}.msg.ok{color:#4ee6a1}
  .tabs{position:sticky;top:0;z-index:9;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:6px 0 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;margin:0;min-height:38px;padding:0 14px;font-size:13px;font-weight:500;border-radius:999px;
    background:transparent;border:1px solid var(--tf-line,rgba(130,170,255,.18));color:var(--tf-muted,#9aaccb)}
  .tabs button.on{background:rgba(100,232,255,.14);border-color:rgba(100,232,255,.5);color:var(--tf-cyan,#64e8ff);font-weight:600}
  body.light .tabs button{background:#fff;color:#5d729a;border-color:#cfdff5}
  body.light .tabs button.on{background:#e6f4ff;color:#1b74d8;border-color:#8fc4ff}
  .pane{display:none}.pane.on{display:block}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:rgba(100,232,255,.05);border:1px solid var(--tf-line,rgba(130,170,255,.18));border-radius:16px;padding:14px 16px}
  body.light .stat{background:#f8fbff;border-color:#dce9fa}
  .stat span{display:block;font-size:12px;color:var(--tf-muted,#9aaccb);margin-bottom:6px}
  .stat b{font-size:23px;font-weight:650;letter-spacing:-.02em}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .toolbar input{flex:1 1 190px}
  .toolbar select{flex:0 0 auto;width:auto;min-width:126px}
  .toolbar button{margin:0}
  .req{border:1px solid var(--tf-line,rgba(130,170,255,.18));border-radius:16px;padding:14px 16px;margin:12px 0;background:rgba(100,232,255,.03)}
  body.light .req{background:#f8fbff;border-color:#dce9fa}
  .req-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .req-title{font-size:15.5px;font-weight:650;line-height:1.4}
  .req-sub{margin-top:3px;font-size:12.5px;color:var(--tf-muted,#9aaccb)}
  .pill{font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(100,232,255,.14);color:#64e8ff;white-space:nowrap}
  .pill.new{background:rgba(255,170,80,.16);color:#ffc07a}
  .pill.contacted{background:rgba(100,232,255,.14);color:#64e8ff}
  .pill.quoted{background:rgba(140,120,255,.18);color:#b0a4ff}
  .pill.done{background:rgba(80,230,160,.16);color:#4ee6a1}
  .pill.closed{background:rgba(150,160,180,.16);color:#98a6bd}
  .pill.ban{background:rgba(255,120,120,.16);color:#ff9d9d}
  .meta{margin:9px 0 0;font-size:12.5px;color:var(--tf-muted,#9aaccb);display:flex;flex-wrap:wrap;gap:6px 14px}
  .note{margin:9px 0 0;font-size:13.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
  .req-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  .req-foot select{flex:0 0 auto;width:auto;min-width:118px;min-height:34px;padding:0 8px;font-size:12.5px;border-radius:10px}
  .dm{border:1px solid var(--tf-line,rgba(130,170,255,.18));border-radius:14px;padding:12px 14px;margin:10px 0;background:rgba(100,232,255,.03)}
  .dm-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--tf-muted,#9aaccb)}
  .dm-top b{color:inherit;font-size:13px}
  .dm-body{margin:8px 0 0;font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
  .dm-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--tf-muted,#9aaccb);flex-wrap:wrap}
  .empty{text-align:center;padding:30px 10px;color:var(--tf-muted,#9aaccb);font-size:13.5px}
  .hidden{display:none}
  .hint{font-size:12.5px;color:var(--tf-muted,#9aaccb);margin:8px 0 0;line-height:1.7}
  @media (max-width:600px){
    .stats{grid-template-columns:1fr;gap:8px}
    .stat{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px}
    .stat span{margin:0}.stat b{font-size:19px}
    .toolbar select{flex:1 1 100%}
    .req-foot select{flex:1 1 100%}
  }
</style>
</head>
<body>
<main>
  <div class="kicker">TAFEI ADMIN · CONSOLE</div>
  <h1>站长后台</h1>
  <p class="lead">预约、账号、私信、商城、公告、举报都在这一页。只有站长邮箱能读。</p>

  <section class="card" id="login">
    <h2>站长登录</h2>
    <label for="email">邮箱</label>
    <input id="email" type="email" inputmode="email" placeholder="3659229103@qq.com" autocomplete="username">
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="账号密码" autocomplete="current-password">
    <button id="loginBtn">登录</button>
    <p class="msg" id="loginMsg"></p>
  </section>

  <section class="hidden" id="console">
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="overview" class="on">概览</button>
      <button type="button" data-tab="booking">预约</button>
      <button type="button" data-tab="accounts">账号</button>
      <button type="button" data-tab="messages">私信</button>
      <button type="button" data-tab="products">商城</button>
      <button type="button" data-tab="notices">公告</button>
      <button type="button" data-tab="reports">举报</button>
      <button type="button" id="logoutBtn" style="margin-left:auto">退出</button>
    </nav>

    <div class="pane on" id="pane-overview">
      <div class="card">
        <div class="stats">
          <div class="stat"><span>待处理预约</span><b id="oNew">—</b></div>
          <div class="stat"><span>今日预约</span><b id="oToday">—</b></div>
          <div class="stat"><span>注册账号</span><b id="oAcc">—</b></div>
          <div class="stat"><span>在售商品</span><b id="oProd">—</b></div>
          <div class="stat"><span>待处理举报</span><b id="oRep">—</b></div>
          <div class="stat"><span>最近私信</span><b id="oDm">—</b></div>
        </div>
        <p class="hint">数字在打开页面时拉取一次，点各标签会重新读取对应模块。</p>
        <button class="ghost" id="refreshOverview">刷新概览</button>
        <p class="msg" id="overviewMsg"></p>
      </div>
      <div class="card">
        <h2>最近 5 条预约</h2>
        <div id="overviewBookings" class="empty">正在读取……</div>
      </div>
    </div>

    <div class="pane" id="pane-booking">
      <div class="card">
        <h2>服务预约</h2>
        <div class="toolbar">
          <input id="bkQ" placeholder="搜机型 / 联系方式 / 备注">
          <select id="bkSt">
            <option value="all">全部状态</option>
            <option value="new">新提交</option>
            <option value="contacted">已联系</option>
            <option value="quoted">已报价</option>
            <option value="done">已完成</option>
            <option value="closed">已关闭</option>
          </select>
          <button class="ghost" id="bkRefresh">刷新</button>
        </div>
        <p class="msg" id="bkMsg"></p>
        <div id="bkList"></div>
      </div>
    </div>

    <div class="pane" id="pane-accounts">
      <div class="card">
        <h2>注册账号</h2>
        <div class="toolbar">
          <input id="accQ" placeholder="邮箱或昵称">
          <select id="banDays">
            <option value="7">封禁 7 天</option>
            <option value="30" selected>封禁 30 天</option>
            <option value="365">封禁 1 年</option>
            <option value="36500">永久封禁</option>
          </select>
          <button class="ghost" id="accRefresh">刷新</button>
        </div>
        <p class="msg" id="accMsg"></p>
        <div id="accList"></div>
      </div>
    </div>

    <div class="pane" id="pane-messages">
      <div class="card">
        <h2>私信审查</h2>
        <div class="toolbar">
          <input id="dmQ" placeholder="关键词 / 邮箱 / 昵称">
          <select id="dmLimit">
            <option value="50">最近 50 条</option>
            <option value="100" selected>最近 100 条</option>
            <option value="300">最近 300 条</option>
          </select>
          <button class="ghost" id="dmRefresh">查询</button>
        </div>
        <p class="msg" id="dmMsg"></p>
        <div id="dmList"></div>
      </div>
    </div>

    <div class="pane" id="pane-products">
      <div class="card">
        <h2>商品维护</h2>
        <p class="hint">下架不会删除记录，改 <b>is_active</b> 即可；外挂类商品建议直接下架。</p>
        <label for="pName">名称</label>
        <input id="pName" placeholder="例如 解 BL 与 Root 部署">
        <div class="toolbar" style="margin-top:10px">
          <input id="pCat" placeholder="分类，例如 技术服务">
          <input id="pPrice" type="number" min="0" step="0.01" placeholder="价格">
        </div>
        <label for="pDesc">介绍</label>
        <textarea id="pDesc" placeholder="一句话说明交付内容和边界"></textarea>
        <label for="pImg">图片链接（可留空）</label>
        <input id="pImg" placeholder="https://...">
        <button id="pSave">添加商品</button>
        <button class="ghost" id="pCancel" hidden>取消编辑</button>
        <p class="msg" id="pMsg"></p>
      </div>
      <div class="card">
        <h2>在售与下架</h2>
        <button class="ghost" id="pRefresh">刷新商品</button>
        <div id="pList"></div>
      </div>
    </div>

    <div class="pane" id="pane-notices">
      <div class="card">
        <h2>发布公告</h2>
        <label for="nTitle">标题</label>
        <input id="nTitle" placeholder="公告标题">
        <label for="nContent">内容</label>
        <textarea id="nContent" rows="6" placeholder="公告正文，支持换行"></textarea>
        <button id="nPublish">发布新公告</button>
        <p class="msg" id="nMsg"></p>
      </div>
      <div class="card">
        <h2>历史公告</h2>
        <button class="ghost" id="nRefresh">刷新公告</button>
        <div id="nList"></div>
      </div>
    </div>

    <div class="pane" id="pane-reports">
      <div class="card">
        <h2>举报处理</h2>
        <button class="ghost" id="rRefresh">刷新举报</button>
        <p class="msg" id="rMsg">还没读取。</p>
        <div id="rList"></div>
      </div>
    </div>
  </section>
</main>

<script>
const URL = 'https://kwkewmhmxyjmzdjyutwa.supabase.co';
const KEY = 'sb_publishable_tyeDf4FmwSW6j7C7s0Gdfg_Me5HqXkV';
const ADMIN_EMAIL = '3659229103@qq.com';
const TOKEN_KEY = 'tafei-console-token';
const BOOKINGS = URL + '/rest/v1/tafei_service_requests';
const PRODUCTS = URL + '/rest/v1/tafei_products';
const REPORTS = URL + '/rest/v1/tafei_reports';
const NOTICES = URL + '/rest/v1/tafei_announcements';

const ST = { new: '新提交', contacted: '已联系', quoted: '已报价', done: '已完成', closed: '已关闭' };

let token = sessionStorage.getItem(TOKEN_KEY) || '';
let bookingRows = [];
let accounts = [];
let editingProduct = null;
let currentTab = 'overview';
const loaded = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const when = (v) => {
  if (!v) return '—';
  const d = new Date(v);
  if (isNaN(d)) return '—';
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
};

function say(id, text, kind) {
  const el = $(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'msg' + (kind ? ' ' + kind : '');
}

async function req(path, options) {
  const opt = options || {};
  const res = await fetch(path, {
    method: opt.method || 'GET',
    headers: {
      apikey: KEY,
      Authorization: 'Bearer ' + (token || KEY),
      'Content-Type': 'application/json',
      ...(opt.headers || {})
    },
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) {
    const err = new Error((data && (data.message || data.hint)) || ('请求失败 ' + res.status));
    err.status = res.status;
    throw err;
  }
  return data;
}

const rpc = (name, body) => req(URL + '/rest/v1/rpc/' + name, { method: 'POST', body: body || {} });

function emailOf(jwt) {
  try {
    const part = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(part).split('').map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json).email || '';
  } catch (e) { return ''; }
}

function authFail(message) {
  token = '';
  sessionStorage.removeItem(TOKEN_KEY);
  $('console').classList.add('hidden');
  $('login').classList.remove('hidden');
  say('loginMsg', message || '登录已失效，请重新用站长邮箱登录。', 'err');
}

async function login() {
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) { say('loginMsg', '请填写邮箱和密码。'); return; }
  $('loginBtn').disabled = true;
  say('loginMsg', '正在验证……');
  try {
    const res = await fetch(URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.msg || data.error_description || data.message || '登录失败');
    if (data.user && data.user.email !== ADMIN_EMAIL) throw new Error('这个账号不是站长邮箱，进不了后台。');
    token = data.access_token;
    sessionStorage.setItem(TOKEN_KEY, token);
    boot();
  } catch (e) {
    token = '';
    sessionStorage.removeItem(TOKEN_KEY);
    $('console').classList.add('hidden');
    $('login').classList.remove('hidden');
    say('loginMsg', '登录失败：' + e.message, 'err');
  } finally {
    $('loginBtn').disabled = false;
  }
}

function boot() {
  $('login').classList.add('hidden');
  $('console').classList.remove('hidden');
  const who = emailOf(token);
  if (who && who !== ADMIN_EMAIL) { authFail('这个账号不是站长邮箱，进不了后台。'); return; }
  loadOverview();
}

function logout() {
  token = '';
  sessionStorage.removeItem(TOKEN_KEY);
  $('console').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('password').value = '';
  say('loginMsg', '已退出。');
}

/* ---------- 概览 ---------- */
async function loadOverview() {
  say('overviewMsg', '正在读取……');
  try {
    const settled = await Promise.allSettled([
      req(BOOKINGS + '?select=id,created_at,status&limit=300'),
      rpc('tafei_admin_accounts'),
      req(PRODUCTS + '?select=id,is_active'),
      req(NOTICES + '?select=id'),
      req(REPORTS + '?select=id,status'),
      rpc('tafei_admin_messages', { p_query: '', p_limit: 200 })
    ]);
    const bad = settled.find((x) => x.status === 'rejected' && x.reason && (x.reason.status === 401 || x.reason.status === 403));
    if (bad) { authFail('登录已失效，请重新用站长邮箱登录。'); return; }
    const val = (i) => (settled[i].status === 'fulfilled' && settled[i].value) || [];
    const b = val(0), a = val(1), p = val(2), n = val(3), r = val(4), d = val(5);
    const bookings = Array.isArray(b) ? b : [];
    const today = new Date();
    const isToday = (iso) => {
      const x = new Date(iso);
      return x.getFullYear() === today.getFullYear() && x.getMonth() === today.getMonth() && x.getDate() === today.getDate();
    };
    $('oNew').textContent = bookings.filter((x) => (x.status || 'new') === 'new').length;
    $('oToday').textContent = bookings.filter((x) => isToday(x.created_at)).length;
    $('oAcc').textContent = (Array.isArray(a) ? a.length : 0);
    $('oProd').textContent = (Array.isArray(p) ? p.filter((x) => x.is_active).length : 0);
    $('oRep').textContent = (Array.isArray(r) ? r.filter((x) => x.status !== 'handled').length : 0);
    $('oDm').textContent = (Array.isArray(d) ? d.length : 0);
    say('overviewMsg', Array.isArray(n) ? ('公告共 ' + n.length + ' 条。') : '', '');
    renderOverviewBookings(bookings.slice(0, 5));
  } catch (e) {
    if (e.status === 401 || e.status === 403) { authFail(); return; }
    say('overviewMsg', '读取失败：' + e.message, 'err');
  }
}

function renderOverviewBookings(rows) {
  const box = $('overviewBookings');
  if (!rows.length) { box.className = 'empty'; box.innerHTML = '还没有预约。'; return; }
  box.className = '';
  $('overviewBookings').innerHTML = rows.map((row) => {
    const st = row.status || 'new';
    return '<div class="req"><div class="req-top"><div><div class="req-title">' + esc(row.device || '未填机型') + '</div>'
      + '<div class="req-sub">' + esc(row.service || '') + '</div></div>'
      + '<span class="pill ' + esc(st) + '">' + esc(ST[st] || st) + '</span></div>'
      + '<div class="meta"><span>' + esc(when(row.created_at)) + '</span></div></div>';
  }).join('');
}

/* ---------- 预约 ---------- */
async function loadBookings(force) {
  if (loaded.booking && !force) return;
  say('bkMsg', '正在读取……');
  try {
    bookingRows = await req(BOOKINGS + '?select=*&order=created_at.desc&limit=300') || [];
    loaded.booking = true;
    say('bkMsg', '');
    renderBookings();
  } catch (e) {
    if (e.status === 401 || e.status === 403 || /42501/.test(e.message)) { authFail('没有读取预约的权限。'); return; }
    say('bkMsg', '读取失败：' + e.message + '（若是表没建，先跑 supabase/service_requests.sql）', 'err');
  }
}

function renderBookings() {
  const q = ($('bkQ').value || '').trim().toLowerCase();
  const st = $('bkSt').value;
  const rows = bookingRows.filter((row) => {
    if (st !== 'all' && (row.status || 'new') !== st) return false;
    if (!q) return true;
    return [row.device, row.os_version, row.service, row.contact, row.note].join(' ').toLowerCase().includes(q);
  });
  if (!rows.length) { $('bkList').innerHTML = '<p class="empty">' + (bookingRows.length ? '这个筛选下没有记录。' : '还没有人提交预约。') + '</p>'; return; }
  $('bkList').innerHTML = rows.map((row) => {
    const s = row.status || 'new';
    const contact = (row.contact_type || 'QQ') + ' ' + (row.contact || '');
    return '<article class="req">'
      + '<div class="req-top"><div><div class="req-title">' + esc(row.device) + '</div>'
      + '<div class="req-sub">' + esc(row.service) + '</div></div>'
      + '<span class="pill ' + esc(s) + '">' + esc(ST[s] || s) + '</span></div>'
      + '<div class="meta"><span>' + esc(when(row.created_at)) + '</span><span>' + esc(contact) + '</span>'
      + (row.os_version ? '<span>系统 ' + esc(row.os_version) + '</span>' : '')
      + (row.source === 'service-page' ? '<span>来自服务页</span>' : '') + '</div>'
      + (row.note ? '<p class="note">' + esc(row.note) + '</p>' : '')
      + '<div class="req-foot">'
      + '<button class="ghost mini" type="button" data-copy="' + esc(contact) + '">复制联系方式</button>'
      + '<button class="ghost mini" type="button" data-copyall="' + row.id + '">复制整条</button>'
      + '<select data-bkst="' + row.id + '">'
      + Object.keys(ST).map((k) => '<option value="' + k + '"' + (k === s ? ' selected' : '') + '>' + ST[k] + '</option>').join('')
      + '</select></div></article>';
  }).join('');
  bindBookings();
}

function bindBookings() {
  $('bkList').querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.textContent = '已复制';
        setTimeout(() => { btn.textContent = '复制联系方式'; }, 1500);
      } catch (e) { window.prompt('手动复制', btn.dataset.copy); }
    });
  });
  $('bkList').querySelectorAll('[data-copyall]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const row = bookingRows.find((r) => String(r.id) === btn.dataset.copyall);
      if (!row) return;
      const text = '【挞飞预约 #' + row.id + '】\n机型：' + row.device + '\n系统：' + (row.os_version || '未填')
        + '\n服务：' + row.service + '\n联系：' + (row.contact_type || 'QQ') + ' ' + row.contact
        + '\n说明：' + (row.note || '无') + '\n时间：' + when(row.created_at);
      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = '已复制';
        setTimeout(() => { btn.textContent = '复制整条'; }, 1500);
      } catch (e) { window.prompt('手动复制', text); }
    });
  });
  $('bkList').querySelectorAll('[data-bkst]').forEach((sel) => {
    sel.addEventListener('change', async () => {
      const id = sel.dataset.bkst;
      sel.disabled = true;
      try {
        await req(BOOKINGS + '?id=eq.' + encodeURIComponent(id), { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { status: sel.value } });
        const row = bookingRows.find((r) => String(r.id) === String(id));
        if (row) row.status = sel.value;
        say('bkMsg', '已更新状态。', 'ok');
        renderBookings();
      } catch (e) {
        sel.disabled = false;
        say('bkMsg', '改状态失败：' + e.message, 'err');
      }
    });
  });
}

/* ---------- 账号 ---------- */
async function loadAccounts(force) {
  if (loaded.accounts && !force) return;
  say('accMsg', '正在读取……');
  try {
    const rows = await rpc('tafei_admin_accounts');
    accounts = Array.isArray(rows) ? rows : [];
    loaded.accounts = true;
    say('accMsg', '共 ' + accounts.length + ' 个注册账号。');
    renderAccounts();
  } catch (e) {
    if (e.status === 401 || e.status === 403 || /42501|只有站长/.test(e.message)) { authFail('这个账号不是站长，读不到账号数据。'); return; }
    say('accMsg', '读取失败：' + e.message + '（若接口没部署，先跑 supabase/admin_audit.sql）', 'err');
  }
}

function renderAccounts() {
  const q = ($('accQ').value || '').trim().toLowerCase();
  const rows = accounts.filter((a) => !q || (a.email || '').toLowerCase().includes(q) || (a.nickname || '').toLowerCase().includes(q));
  if (!rows.length) { $('accList').innerHTML = '<p class="empty">没有匹配的账号。</p>'; return; }
  $('accList').innerHTML = rows.map((a) => {
    const banned = a.banned_until && new Date(a.banned_until) > new Date();
    return '<article class="req"><div class="req-top"><div><div class="req-title">' + esc(a.email || a.uid) + '</div>'
      + '<div class="req-sub">' + esc(a.nickname || '未设置昵称') + '</div></div>'
      + (banned ? '<span class="pill ban">已封禁至 ' + esc(when(a.banned_until)) + '</span>' : '<span class="pill done">正常</span>')
      + '</div><div class="meta"><span>注册 ' + esc(when(a.created_at)) + '</span><span>最后登录 ' + esc(when(a.last_sign_in_at)) + '</span>'
      + '<span>私信 ' + esc(a.msg_count) + ' 条</span></div>'
      + '<div class="req-foot">'
      + (banned
        ? '<button class="ghost mini" type="button" data-unban="' + esc(a.uid) + '">解封</button>'
        : '<button class="danger mini" type="button" data-ban="' + esc(a.uid) + '">封禁</button>')
      + '</div></article>';
  }).join('');
}

async function banUser(uid) {
  const acc = accounts.find((a) => a.uid === uid) || {};
  const days = parseInt($('banDays').value, 10) || 30;
  const label = days >= 36500 ? '永久' : days + ' 天';
  if (!confirm('确认封禁 ' + (acc.email || uid) + ' ？封禁 ' + label + '。')) return;
  try {
    await rpc('tafei_admin_ban', { p_uid: uid, p_days: days });
    say('accMsg', '已封禁 ' + (acc.email || uid) + '（' + label + '）。', 'ok');
    loadAccounts(true);
  } catch (e) { say('accMsg', '封禁失败：' + e.message, 'err'); }
}

async function unbanUser(uid) {
  const acc = accounts.find((a) => a.uid === uid) || {};
  if (!confirm('确认解封 ' + (acc.email || uid) + ' ？')) return;
  try {
    await rpc('tafei_admin_unban', { p_uid: uid });
    say('accMsg', '已解封 ' + (acc.email || uid) + '。', 'ok');
    loadAccounts(true);
  } catch (e) { say('accMsg', '解封失败：' + e.message, 'err'); }
}

/* ---------- 私信 ---------- */
async function loadMessages(force) {
  if (loaded.messages && !force) return;
  say('dmMsg', '正在读取……');
  try {
    const rows = await rpc('tafei_admin_messages', { p_query: ($('dmQ').value || '').trim(), p_limit: parseInt($('dmLimit').value, 10) || 100 });
    const list = Array.isArray(rows) ? rows : [];
    loaded.messages = true;
    say('dmMsg', '读到 ' + list.length + ' 条私信。');
    if (!list.length) { $('dmList').innerHTML = '<p class="empty">没有匹配的私信。</p>'; return; }
    $('dmList').innerHTML = list.map((m) => '<article class="dm">'
      + '<div class="dm-top"><b>' + esc(m.sender_name) + '</b><span>→</span><b>' + esc(m.recipient_name) + '</b>'
      + '<span>· ' + esc(when(m.created_at)) + (m.read_at ? ' · 已读' : ' · 未读') + '</span></div>'
      + '<p class="dm-body">' + esc(m.body) + '</p>'
      + '<div class="dm-foot"><span>' + esc(m.sender_email) + ' → ' + esc(m.recipient_email) + '</span>'
      + '<button class="danger mini" type="button" data-del="' + esc(m.id) + '">删除这条</button></div></article>').join('');
  } catch (e) {
    if (e.status === 401 || e.status === 403 || /42501|只有站长/.test(e.message)) { authFail('这个账号不是站长，读不到私信。'); return; }
    say('dmMsg', '读取失败：' + e.message, 'err');
  }
}

async function removeMessage(id) {
  if (!confirm('确认删除这条私信？删除后双方都看不到了。')) return;
  try {
    await rpc('tafei_admin_delete_message', { p_id: parseInt(id, 10) });
    say('dmMsg', '已删除第 ' + id + ' 条私信。', 'ok');
    loadMessages(true);
  } catch (e) { say('dmMsg', '删除失败：' + e.message, 'err'); }
}

/* ---------- 商品 ---------- */
async function loadProducts(force) {
  if (loaded.products && !force) return;
  $('pList').innerHTML = '<p class="empty">正在读取……</p>';
  try {
    const rows = await req(PRODUCTS + '?select=*&order=id.desc');
    const list = Array.isArray(rows) ? rows : [];
    loaded.products = true;
    if (!list.length) { $('pList').innerHTML = '<p class="empty">还没有商品。</p>'; return; }
    $('pList').innerHTML = list.map((item) => '<article class="req">'
      + '<div class="req-top"><div><div class="req-title">' + esc(item.name) + '</div>'
      + '<div class="req-sub">' + esc(item.category || '未分类') + '</div></div>'
      + '<span class="pill ' + (item.is_active ? 'done' : 'closed') + '">' + (item.is_active ? '已上架' : '已下架') + '</span></div>'
      + '<div class="meta"><span>¥' + esc(item.price) + '</span></div>'
      + (item.description ? '<p class="note">' + esc(item.description) + '</p>' : '')
      + '<div class="req-foot">'
      + '<button class="ghost mini" type="button" data-pedit="' + item.id + '">编辑</button>'
      + '<button class="' + (item.is_active ? 'danger' : 'ghost') + ' mini" type="button" data-ptoggle="' + item.id + '">' + (item.is_active ? '下架' : '上架') + '</button>'
      + '</div></article>').join('');
  } catch (e) { $('pList').innerHTML = '<p class="empty">读取失败：' + esc(e.message) + '</p>'; }
}

function fillProductForm(item) {
  editingProduct = item;
  $('pName').value = item.name || '';
  $('pCat').value = item.category || '';
  $('pPrice').value = item.price == null ? '' : item.price;
  $('pDesc').value = item.description || '';
  $('pImg').value = item.image_url || '';
  $('pSave').textContent = '保存修改';
  $('pCancel').hidden = false;
  say('pMsg', '正在编辑：' + item.name);
  window.scrollTo({ top: $('pane-products').offsetTop - 60, behavior: 'smooth' });
}

function resetProductForm() {
  editingProduct = null;
  ['pName', 'pCat', 'pPrice', 'pDesc', 'pImg'].forEach((id) => { $(id).value = ''; });
  $('pSave').textContent = '添加商品';
  $('pCancel').hidden = true;
  say('pMsg', '');
}

async function saveProduct() {
  const name = $('pName').value.trim();
  const priceRaw = $('pPrice').value.trim();
  const price = priceRaw === '' ? null : Number(priceRaw);
  if (!name) { say('pMsg', '商品名称必填。', 'err'); return; }
  if (price != null && (!isFinite(price) || price < 0)) { say('pMsg', '价格要填非负数字。', 'err'); return; }
  const body = {
    name,
    category: $('pCat').value.trim() || '其他',
    price,
    description: $('pDesc').value.trim(),
    image_url: $('pImg').value.trim() || null,
    is_active: true
  };
  $('pSave').disabled = true;
  try {
    if (editingProduct) {
      await req(PRODUCTS + '?id=eq.' + encodeURIComponent(editingProduct.id), { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body });
      say('pMsg', '已保存修改。', 'ok');
    } else {
      await req(PRODUCTS, { method: 'POST', headers: { Prefer: 'return=minimal' }, body });
      say('pMsg', '已添加商品。', 'ok');
    }
    resetProductForm();
    loadProducts(true);
  } catch (e) { say('pMsg', '保存失败：' + e.message, 'err'); }
  finally { $('pSave').disabled = false; }
}

async function toggleProduct(id) {
  let active = true;
  try {
    const rows = await req(PRODUCTS + '?id=eq.' + encodeURIComponent(id) + '&select=id,is_active');
    if (Array.isArray(rows) && rows[0]) active = !!rows[0].is_active;
  } catch (e) {
    say('pMsg', '读取商品状态失败：' + e.message, 'err');
    return;
  }
  if (!confirm(active ? '确认下架这件商品？' : '确认重新上架这件商品？')) return;
  try {
    await req(PRODUCTS + '?id=eq.' + encodeURIComponent(id), { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { is_active: !active } });
    say('pMsg', active ? '已下架。' : '已上架。', 'ok');
    loadProducts(true);
  } catch (e) { say('pMsg', '操作失败：' + e.message, 'err'); }
}

/* ---------- 公告 ---------- */
async function loadNotices(force) {
  if (loaded.notices && !force) return;
  $('nList').innerHTML = '<p class="empty">正在读取……</p>';
  try {
    const rows = await req(NOTICES + '?select=id,title,content,version,is_active,created_at&order=version.desc');
    const list = Array.isArray(rows) ? rows : [];
    loaded.notices = true;
    if (!list.length) { $('nList').innerHTML = '<p class="empty">还没有公告。</p>'; return; }
    $('nList').innerHTML = list.map((n) => '<article class="req">'
      + '<div class="req-top"><div class="req-title">V' + esc(n.version) + ' · ' + esc(n.title) + '</div>'
      + (n.is_active ? '<span class="pill done">生效中</span>' : '<span class="pill closed">历史</span>') + '</div>'
      + '<div class="meta"><span>' + esc(when(n.created_at)) + '</span></div>'
      + '<p class="note">' + esc(n.content) + '</p></article>').join('');
  } catch (e) { $('nList').innerHTML = '<p class="empty">读取失败：' + esc(e.message) + '</p>'; }
}

async function publishNotice() {
  const title = $('nTitle').value.trim();
  const content = $('nContent').value.trim();
  if (!title || !content) { say('nMsg', '标题和内容都要填。', 'err'); return; }
  if (!confirm('发布后所有访客都会重新看到公告，确认发布？')) return;
  $('nPublish').disabled = true;
  say('nMsg', '正在发布……');
  try {
    const v = await rpc('publish_tafei_announcement', { p_title: title, p_content: content });
    $('nTitle').value = '';
    $('nContent').value = '';
    say('nMsg', '发布成功，公告编号 ' + v + '。', 'ok');
    loadNotices(true);
  } catch (e) { say('nMsg', '发布失败：' + e.message + '（若接口没部署，先跑 supabase 里的公告 SQL）', 'err'); }
  finally { $('nPublish').disabled = false; }
}

/* ---------- 举报 ---------- */
async function loadReports(force) {
  if (loaded.reports && !force) return;
  say('rMsg', '正在读取……');
  try {
    const rows = await req(REPORTS + '?select=id,article_id,reason,description,created_at,status,admin_note,handled_at&order=created_at.desc');
    const list = Array.isArray(rows) ? rows : [];
    loaded.reports = true;
    say('rMsg', '共 ' + list.length + ' 条举报。');
    if (!list.length) { $('rList').innerHTML = '<p class="empty">没有举报记录。</p>'; return; }
    $('rList').innerHTML = list.map((r) => '<article class="req">'
      + '<div class="req-top"><div class="req-title">文章 #' + esc(r.article_id) + '</div>'
      + (r.status === 'handled' ? '<span class="pill done">已处理</span>' : '<span class="pill new">待处理</span>') + '</div>'
      + '<div class="meta"><span>' + esc(when(r.created_at)) + '</span><span>' + esc(r.reason) + '</span></div>'
      + (r.description ? '<p class="note">' + esc(r.description) + '</p>' : '')
      + (r.status === 'handled'
        ? '<p class="note" style="color:var(--tf-muted,#9aaccb)">处理备注：' + esc(r.admin_note || '无') + '</p>'
        : '<div class="req-foot"><input placeholder="处理备注（可留空）" data-note="' + r.id + '">'
          + '<button class="ghost mini" type="button" data-handle="' + r.id + '">标记已处理</button></div>')
      + '</article>').join('');
  } catch (e) {
    if (e.status === 401 || e.status === 403 || /42501/.test(e.message)) { say('rMsg', '举报表没有开放给当前账号读取（42501）。', 'err'); return; }
    say('rMsg', '读取失败：' + e.message, 'err');
  }
}

async function handleReport(id) {
  const input = $('rList').querySelector('[data-note="' + id + '"]');
  const note = input ? input.value.trim().slice(0, 500) : '';
  if (!confirm('标记为已处理？')) return;
  try {
    await req(REPORTS + '?id=eq.' + encodeURIComponent(id), {
      method: 'PATCH',
      headers: { Prefer: 'return=minimal' },
      body: { status: 'handled', admin_note: note, handled_at: new Date().toISOString() }
    });
    say('rMsg', '已标记处理。', 'ok');
    loadReports(true);
  } catch (e) { say('rMsg', '保存失败：' + e.message, 'err'); }
}

/* ---------- tab 切换 ---------- */
function switchTab(name) {
  currentTab = name;
  $('tabs').querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  ['overview', 'booking', 'accounts', 'messages', 'products', 'notices', 'reports'].forEach((k) => {
    $('pane-' + k).classList.toggle('on', k === name);
  });
  if (name === 'overview') loadOverview();
  if (name === 'booking') loadBookings();
  if (name === 'accounts') loadAccounts();
  if (name === 'messages') loadMessages();
  if (name === 'products') loadProducts();
  if (name === 'notices') loadNotices();
  if (name === 'reports') loadReports();
}

/* ---------- 事件 ---------- */
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { switchTab(tab.dataset.tab); return; }
  const ban = e.target.closest('[data-ban]');
  if (ban) { banUser(ban.dataset.ban); return; }
  const unb = e.target.closest('[data-unban]');
  if (unb) { unbanUser(unb.dataset.unban); return; }
  const del = e.target.closest('[data-del]');
  if (del) { removeMessage(del.dataset.del); return; }
  const handle = e.target.closest('[data-handle]');
  if (handle) { handleReport(handle.dataset.handle); return; }
  const ptoggle = e.target.closest('[data-ptoggle]');
  if (ptoggle) { toggleProduct(ptoggle.dataset.ptoggle); }
});

$('loginBtn').addEventListener('click', login);
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
$('logoutBtn').addEventListener('click', logout);
$('refreshOverview').addEventListener('click', loadOverview);
$('bkQ').addEventListener('input', renderBookings);
$('bkSt').addEventListener('change', renderBookings);
$('bkRefresh').addEventListener('click', () => loadBookings(true));
$('accQ').addEventListener('input', renderAccounts);
$('accRefresh').addEventListener('click', () => loadAccounts(true));
$('dmRefresh').addEventListener('click', () => loadMessages(true));
$('dmLimit').addEventListener('change', () => loadMessages(true));
$('pSave').addEventListener('click', saveProduct);
$('pCancel').addEventListener('click', resetProductForm);
$('pRefresh').addEventListener('click', () => loadProducts(true));
$('nPublish').addEventListener('click', publishNotice);
$('nRefresh').addEventListener('click', () => loadNotices(true));
$('rRefresh').addEventListener('click', () => loadReports(true));

// 编辑商品：从列表按钮回填表单（需要完整数据，单独拉一次）
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-pedit]');
  if (!btn) return;
  const id = btn.dataset.pedit;
  try {
    const rows = await req(PRODUCTS + '?id=eq.' + encodeURIComponent(id) + '&select=*');
    if (Array.isArray(rows) && rows[0]) fillProductForm(rows[0]);
  } catch (err) { say('pMsg', '读取商品失败：' + err.message, 'err'); }
});

if (token) boot();
</script>
