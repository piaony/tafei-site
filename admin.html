<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>挞飞 · 管理员后台</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101827;color:#edf3ff;font-family:Arial,sans-serif}
main{max-width:850px;margin:35px auto}
.panel{background:#1b2940;padding:22px;border-radius:16px;margin:18px 0}
h1{color:#80caff}
input,textarea,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:0;font-size:15px}
textarea{min-height:75px;resize:vertical}
button{background:#62b5f5;color:#102033;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.report{background:#263750;padding:16px;border-radius:12px;margin:14px 0;overflow-wrap:anywhere}
small{color:#aabbd1}
.status{font-weight:bold;color:#ffd479}
.handled{color:#8de0ae}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>TAFEI 挞飞</h1>
<p>9.1 · 社区安全管理中心</p>

<section class="panel" id="login">
<h2>管理员登录</h2>
<input id="email" type="email" placeholder="管理员邮箱">
<input id="password" type="password" placeholder="管理员密码">
<button id="loginBtn">登录管理后台</button>
<p id="loginMsg"></p>
</section>

<section class="panel hidden" id="dashboard">
<h2>公告管理</h2>
<input id="announcementTitle" type="text" placeholder="公告标题">
<textarea id="announcementContent" placeholder="公告内容" rows="5"></textarea>
<button id="publishAnnouncementBtn">发布新公告</button>
<p id="announcementStatus"></p>
<div id="announcements"></div>

<h2>商品管理</h2>
<div class="report">
<input id="productName" placeholder="商品名称">
<input id="productCategory" placeholder="商品分类">
<input id="productPrice" type="number" min="0" step="0.01" placeholder="商品价格">
<textarea id="productDescription" placeholder="商品介绍"></textarea>
<input id="productImage" placeholder="商品图片链接（可留空）">
<button id="saveProductBtn">添加商品</button>
<button id="cancelEditBtn" type="button" hidden>取消编辑</button>
<p id="editStatus"></p>
<p id="productStatus"></p>
</div>
<button id="refreshProductsBtn">刷新商品列表</button>
<div id="products"></div>

<h2>社区内容管理</h2>
<div class="report">
<select id="contentType">
<option value="tafei_posts">社区动态</option>
<option value="tafei_comments">动态评论</option>
<option value="tafei_articles">知识分享文章</option>
<option value="tafei-cloud">留言板留言</option>
</select>
<button id="refreshContentBtn">查看社区内容</button>
<p id="contentStatus"></p>
<div id="communityContent"></div>
</div>

<h2>举报管理</h2>
<p id="status">正在加载举报……</p>
<button id="refreshBtn">刷新举报</button>
<div id="reports"></div>
<button id="logoutBtn">退出登录</button>
</section>
</main>

<script>
const URL='https://kwkewmhmxyjmzdjyutwa.supabase.co';
const KEY='sb_publishable_tyeDf4FmwSW6j7C7s0Gdfg_Me5HqXkV';

let accessToken=null;
const $=id=>document.getElementById(id);

function message(text){
 $('loginMsg').textContent=text;
}

function handleAdminAuthFailure(messageText){
 accessToken=null;
 $('dashboard').classList.add('hidden');
 $('login').classList.remove('hidden');
 $('password').value='';
 message(messageText || '管理员登录已失效，请重新登录。');
}

async function login(){
 const email=$('email').value.trim();
 const password=$('password').value;

 if(!email||!password){
  message('请填写邮箱和密码。');
  return;
 }

 $('loginBtn').disabled=true;
 message('正在验证账号……');

 try{
  const res=await fetch(URL+'/auth/v1/token?grant_type=password',{
   method:'POST',
   headers:{apikey:KEY,'Content-Type':'application/json'},
   body:JSON.stringify({email,password})
  });

  const data=await res.json();
  if(!res.ok) throw new Error(data.msg||data.message||'登录失败');

  accessToken=data.access_token;

  const adminRes=await fetch(URL+'/rest/v1/rpc/is_tafei_admin',{
   method:'POST',
   headers:{
    apikey:KEY,
    Authorization:'Bearer '+accessToken,
    'Content-Type':'application/json'
   },
   body:'{}'
  });

  const isAdmin=await adminRes.json();
  if(!adminRes.ok || isAdmin!==true){
   throw new Error('当前账号不是挞飞管理员，无法进入后台。');
  }

  $('login').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  await loadReports();
  await loadAnnouncements();
  await loadProducts();

 }catch(e){
  accessToken=null;
  message('登录失败：'+e.message);
 }finally{
  $('loginBtn').disabled=false;
 }
}

async function loadAnnouncements(){
 const box=$('announcements');
 const status=$('announcementStatus');
 box.replaceChildren();
 status.textContent='正在读取公告……';

 try{
  const res=await fetch(
   URL+'/rest/v1/tafei_announcements?select=id,title,content,version,is_active,created_at&order=version.desc',
   {headers:{
    apikey:KEY,
    Authorization:'Bearer '+accessToken
   }}
  );

  const data=await res.json();

  if(res.status===401){
   handleAdminAuthFailure('管理员登录已失效，请重新登录。');
   return;
  }

  if(!res.ok) throw new Error(data.message||'读取公告失败');

  status.textContent='共 '+data.length+' 条公告';

  if(data.length===0){
   box.textContent='目前还没有公告。';
   return;
  }

  data.forEach(item=>{
   const card=document.createElement('article');
   card.style.cssText='padding:12px;margin:10px 0;border:1px solid #888;border-radius:10px;';

   const heading=document.createElement('h3');
   heading.textContent='V'+item.version+' · '+item.title;

   const state=document.createElement('p');
   state.textContent=item.is_active?'当前生效':'历史公告';

   const content=document.createElement('p');
   content.textContent=item.content;
   content.style.whiteSpace='pre-wrap';

   card.append(heading,state,content);
   box.append(card);
  });
 }catch(e){
  status.textContent='公告读取失败：'+e.message;
 }
}

async function loadReports(){
 $('status').textContent='正在读取举报记录……';
 $('reports').replaceChildren();

 try{
  const res=await fetch(
   URL+'/rest/v1/tafei_reports?select=id,article_id,reason,description,created_at,status,admin_note,handled_at&order=created_at.desc',
   {headers:{
    apikey:KEY,
    Authorization:'Bearer '+accessToken
   }}
  );

  const data=await res.json();

  if(res.status===401){
   handleAdminAuthFailure('管理员登录已失效，请重新登录。');
   return;
  }

  if(!res.ok) throw new Error(data.message||'读取失败');

  $('status').textContent='共收到 '+data.length+' 条举报';

  if(data.length===0){
   $('reports').textContent='目前没有举报记录。';
   return;
  }

  data.forEach(item=>{
   const card=document.createElement('div');
   card.className='report';

   const title=document.createElement('h3');
   title.textContent='举报文章 ID：'+item.article_id;

   const reason=document.createElement('p');
   reason.textContent='举报原因：'+item.reason;

   const desc=document.createElement('p');
   desc.textContent='补充说明：'+(item.description||'无');

   const date=document.createElement('small');
   date.textContent='提交时间：'+new Date(item.created_at).toLocaleString();

   const state=document.createElement('p');
   state.className='status '+(item.status==='handled'?'handled':'');
   state.textContent=item.status==='handled'?'状态：已处理':'状态：待处理';

   const note=document.createElement('p');
   note.textContent='处理备注：'+(item.admin_note||'暂无');

   card.append(title,reason,desc,date,state,note);

   if(item.handled_at){
    const handledDate=document.createElement('small');
    handledDate.textContent='处理时间：'+new Date(item.handled_at).toLocaleString();
    card.append(handledDate);
   }

   if(item.status!=='handled'){
    const textarea=document.createElement('textarea');
    textarea.placeholder='填写处理备注（最多500字）';
    textarea.maxLength=500;

    const btn=document.createElement('button');
    btn.textContent='标记为已处理';

    btn.addEventListener('click',async()=>{
     await markHandled(item.id,textarea.value,btn);
    });

    card.append(textarea,btn);
   }

   $('reports').append(card);
  });

 }catch(e){
  $('status').textContent='读取失败：'+e.message;
 }
}

async function markHandled(id,note,button){
 if(note.length>500){
  alert('处理备注不能超过500字。');
  return;
 }

 if(!confirm('确定将这条举报标记为已处理吗？')) return;

 button.disabled=true;
 button.textContent='正在保存……';

 try{
  const res=await fetch(
   URL+'/rest/v1/tafei_reports?id=eq.'+encodeURIComponent(id),
   {
    method:'PATCH',
    headers:{
     apikey:KEY,
     Authorization:'Bearer '+accessToken,
     'Content-Type':'application/json',
     Prefer:'return=minimal'
    },
    body:JSON.stringify({
     status:'handled',
     admin_note:note,
     handled_at:new Date().toISOString()
})
}
);
if(res.status===401){
 handleAdminAuthFailure('管理员登录已失效，请重新登录。');
 return;
}
if(!res.ok){
 const data=await res.json();
 throw new Error(data.message||'保存失败');
}
alert('举报处理状态已保存！');
await loadReports();
}catch(e){
 alert('保存失败：'+e.message);
 button.disabled=false;
 button.textContent='标记为已处理';
}
}


async function publishAnnouncement(){
 const title=$('announcementTitle').value.trim();
 const content=$('announcementContent').value.trim();
 const status=$('announcementStatus');

 if(!title || !content){
  status.textContent='请填写公告标题和内容。';
  return;
 }

 if(!confirm('确定发布这条新公告吗？发布后所有访客都需要重新确认。')){
  return;
 }

 const button=$('publishAnnouncementBtn');
 button.disabled=true;
 status.textContent='正在发布……';

 try{
  const res=await fetch(URL+'/rest/v1/rpc/publish_tafei_announcement',{
   method:'POST',
   headers:{
    apikey:KEY,
    Authorization:'Bearer '+accessToken,
    'Content-Type':'application/json'
   },
   body:JSON.stringify({
    p_title:title,
    p_content:content
   })
  });

  const data=await res.json();

  if(res.status===401){
   handleAdminAuthFailure('管理员登录已失效，请重新登录。');
   return;
  }

  if(!res.ok){
   throw new Error(data.message||data.msg||'发布失败');
  }

  $('announcementTitle').value='';
  $('announcementContent').value='';
  status.textContent='公告发布成功！公告编号：'+data;
  await loadAnnouncements();
 }catch(e){
  status.textContent='发布失败：'+e.message;
 }finally{
  button.disabled=false;
 }
}

function logout(){
 accessToken=null;
 $('password').value='';
 $('dashboard').classList.add('hidden');
 $('login').classList.remove('hidden');
 message('已退出登录。');
}


const PRODUCTS_API = URL + '/rest/v1/tafei_products';

let editingProductId=null;

async function loadProducts(){
 const root = $('products');
 const status = $('productStatus');
 root.textContent = '正在加载商品……';
 try{
  const res = await fetch(PRODUCTS_API + '?select=*&order=id.desc',{
   headers:{apikey:KEY,Authorization:'Bearer '+accessToken}
  });
  const rows = await res.json();

  if(res.status===401){
   handleAdminAuthFailure('管理员登录已失效，请重新登录。');
   return;
  }

  if(!res.ok) throw new Error(rows.message || '读取失败');
  root.replaceChildren();
  if(!rows.length) root.textContent='目前还没有商品。';
  rows.forEach(item=>{
   const card=document.createElement('div');
   card.className='report';
   const title=document.createElement('h3');
   title.textContent=item.name+' · ¥'+item.price;
   const detail=document.createElement('p');
   detail.textContent=item.category+'：'+item.description;
   const state=document.createElement('p');
   state.textContent=item.is_active?'已上架':'已下架';
   const edit=document.createElement('button');
   edit.textContent='编辑商品';
   edit.addEventListener('click',()=>{
    editingProductId=item.id;
    $('productName').value=item.name||'';
    $('productCategory').value=item.category||'';
    $('productPrice').value=item.price??'';
    $('productDescription').value=item.description||'';
    $('productImage').value=item.image_url||'';
    $('saveProductBtn').textContent='保存修改';
    $('cancelEditBtn').hidden=false;
    $('editStatus').textContent='正在编辑：'+item.name;
    $('productStatus').textContent='修改完成后点击保存修改。';
    window.scrollTo({top:0,behavior:'smooth'});
   });
   const toggle=document.createElement('button');
   toggle.textContent=item.is_active?'下架商品':'上架商品';
   toggle.addEventListener('click',()=>toggleProduct(item.id,!item.is_active));
   card.append(title,detail,state,edit,toggle);
   root.appendChild(card);
  });
  status.textContent='商品列表已更新。';
 }catch(e){
  root.textContent='加载失败：'+e.message;
 }
}

async function toggleProduct(id,active){
 if(!confirm(active?'确定上架这件商品吗？':'确定下架这件商品吗？')) return;
 try{
  const res=await fetch(PRODUCTS_API+'?id=eq.'+id,{
   method:'PATCH',
   headers:{apikey:KEY,Authorization:'Bearer '+accessToken,
    'Content-Type':'application/json',Prefer:'return=minimal'},
   body:JSON.stringify({is_active:active,updated_at:new Date().toISOString()})
  });

  if(res.status===401){
   handleAdminAuthFailure('管理员登录已失效，请重新登录。');
   return;
  }

  if(!res.ok) throw new Error('修改失败，HTTP '+res.status);
  await loadProducts();
 }catch(e){$('productStatus').textContent=e.message;}
}

async function saveProduct(){
 const name=$('productName').value.trim();
 const category=$('productCategory').value.trim();
 const price=Number($('productPrice').value);
 if(!name||!category||$('productPrice').value===''||!Number.isFinite(price)||price<0){
  $('productStatus').textContent='请填写商品名称、分类和有效价格。';
  return;
 }
 const button=$('saveProductBtn');
 button.disabled=true;
 try{
  const editing=editingProductId!==null;
  const res=await fetch(
   editing?PRODUCTS_API+'?id=eq.'+encodeURIComponent(editingProductId):PRODUCTS_API,
   {
    method:editing?'PATCH':'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+accessToken,
     'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify({
     name,category,price,
     description:$('productDescription').value.trim(),
     image_url:$('productImage').value.trim(),
     updated_at:new Date().toISOString(),
     ...(editing?{}:{is_active:false})
    })
   }
  );
  if(res.status===401){
   handleAdminAuthFailure('管理员登录已失效，请重新登录。');
   return;
  }

  if(!res.ok){
   const data=await res.json();
   throw new Error(data.message||'保存失败，HTTP '+res.status);
  }
  editingProductId=null;
  $('saveProductBtn').textContent='添加商品';
  $('cancelEditBtn').hidden=true;
  $('editStatus').textContent='';
  $('productName').value='';
  $('productCategory').value='';
  $('productPrice').value='';
  $('productDescription').value='';
  $('productImage').value='';
  $('productStatus').textContent='商品已保存，当前默认下架。';
  await loadProducts();
 }catch(e){
  $('productStatus').textContent='添加失败：'+e.message;
 }finally{button.disabled=false;}
}


const CONTENT_TABLES = {
 tafei_posts:{label:'社区动态',fields:'id,user_id,category,content,created_at'},
 tafei_comments:{label:'动态评论',fields:'id,post_id,user_id,content,created_at'},
 tafei_articles:{label:'知识分享',fields:'id,nickname,title,content,created_at'},
 'tafei-cloud':{label:'留言板',fields:'id,nickname,content,created_at'}
};

async function loadContent(){
 const type=$('contentType').value;
 const config=CONTENT_TABLES[type];
 const root=$('communityContent');
 $('contentStatus').textContent='正在读取……';
 root.replaceChildren();
 try{
  const res=await fetch(URL+'/rest/v1/'+type+'?select='+config.fields+'&order=created_at.desc&limit=100',{
   headers:{apikey:KEY,Authorization:'Bearer '+accessToken}
  });
  const rows=await res.json();

  if(res.status===401){
   handleAdminAuthFailure('管理员登录已失效，请重新登录。');
   return;
  }

  if(!res.ok) throw new Error(rows.message||'读取失败，HTTP '+res.status);
  $('contentStatus').textContent=config.label+'：共 '+rows.length+' 条';
  if(!rows.length){root.textContent='暂无内容';return;}
  rows.forEach(item=>{
   const card=document.createElement('div');
   card.className='report';
   const heading=document.createElement('h3');
   heading.textContent=item.title||item.nickname||item.category||config.label;
   const meta=document.createElement('small');
   meta.textContent='ID：'+item.id+' · '+(item.created_at||'');
   const body=document.createElement('p');
   body.textContent=item.content||'';
   const del=document.createElement('button');
   del.textContent='删除这条内容';
   del.addEventListener('click',()=>deleteContent(type,item));
   card.append(heading,meta,body,del);
   root.appendChild(card);
  });
 }catch(e){
  $('contentStatus').textContent='读取失败：'+e.message;
 }
}

async function deleteContent(type,item){
 const config=CONTENT_TABLES[type];
 if(!confirm('确定删除这条'+config.label+'吗？此操作无法撤销。')) return;
 try{
  const headers={apikey:KEY,Authorization:'Bearer '+accessToken,
   Prefer:'return=minimal'};
  if(type==='tafei_posts'){
   const comments=await fetch(URL+'/rest/v1/tafei_comments?post_id=eq.'+encodeURIComponent(item.id),{
    method:'DELETE',headers
   });

   if(comments.status===401){
    handleAdminAuthFailure('管理员登录已失效，请重新登录。');
    return;
   }

   if(!comments.ok) throw new Error('删除动态评论失败，HTTP '+comments.status);
  }
  const res=await fetch(URL+'/rest/v1/'+type+'?id=eq.'+encodeURIComponent(item.id),{
   method:'DELETE',headers
  });

  if(res.status===401){
   handleAdminAuthFailure('管理员登录已失效，请重新登录。');
   return;
  }

  if(!res.ok) throw new Error('删除失败，HTTP '+res.status);
  $('contentStatus').textContent='删除成功';
  await loadContent();
 }catch(e){
  $('contentStatus').textContent='操作失败：'+e.message;
 }
}

$('publishAnnouncementBtn').addEventListener('click',publishAnnouncement);
$('loginBtn').addEventListener('click',login);
$('refreshBtn').addEventListener('click',loadReports);
$('logoutBtn').addEventListener('click',logout);
$('cancelEditBtn').addEventListener('click',()=>{
 editingProductId=null;
 $('productName').value='';
 $('productCategory').value='';
 $('productPrice').value='';
 $('productDescription').value='';
 $('productImage').value='';
 $('saveProductBtn').textContent='添加商品';
 $('cancelEditBtn').hidden=true;
 $('editStatus').textContent='';
 $('productStatus').textContent='已取消编辑。';
});
$('saveProductBtn').addEventListener('click',saveProduct);
$('refreshProductsBtn').addEventListener('click',loadProducts);
$('refreshContentBtn').addEventListener('click',loadContent);
</script>
</body>
</html>
