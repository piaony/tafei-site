  .nw-tools input{flex:1 1 220px;min-height:48px;padding:0 16px;border-radius:14px;font:inherit;font-size:15px;

  .nw-count{font-size:13px;color:var(--tf-muted,#9aaccb);white-space:nowrap}
  .nw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
  .nw-card{position:relative;display:grid;gap:6px;padding:16px 16px 14px;border-radius:16px;text-decoration:none;color:inherit;

  .nw-more{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;padding:18px 20px;border-radius:18px;
    text-decoration:none;color:inherit;border:1px solid rgba(100,232,255,.35);background:linear-gradient(120deg,rgba(59,143,255,.14),rgba(132,107,255,.14))}
  .nw-more strong{font-size:16px}

<main class="pw">
  <section class="pg-hero">
    <p class="pg-eyebrow">NAIWA ARCADE</p>
    <h1 class="pg-title">奶娃<br><em>点什么玩什么</em></h1>
    <p class="pg-lead">奶蛙系列的网页小游戏，全部在浏览器里跑，不用下载、不用装模拟器。点开就玩，玩完关掉也不占内存。</p>
    <div class="nw-tools">
      <input id="q" type="search" placeholder="搜游戏名，例如「2048」「羽毛球」" aria-label="搜索游戏">
      <span class="nw-count" id="count">共 27 个</span>
    </div>
    <p class="nw-note">下面这些链接会跳到 <b>milkyfrog.com</b>（外部站点），不在挞飞站内。外站页面自己带广告或分享按钮，注意别乱填账号密码。</p>

<script>
(() => {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const qEl = document.getElementById('q');
  let games = [];

  function host(url) {
    try { return new URL(url).host; } catch (e) { return 'milkyfrog.com'; }
  }

  function render(q) {
    const key = (q || '').trim().toLowerCase();
    const list = key ? games.filter((g) => g.name.toLowerCase().includes(key)) : games;
    count.textContent = key ? `筛出 ${list.length} 个` : `共 ${games.length} 个`;
    if (!list.length) {
      grid.innerHTML = '<p class="nw-empty">没有这个游戏。去下面的官方合集页找找。</p>';
      return;
    }
    grid.innerHTML = list.map((g) => `<a class="nw-card" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer">
      <span class="nw-no">${String(g.id).padStart(2, '0')}</span>
      <span class="nw-name">${esc(g.name)}</span>
      <span class="nw-host">${esc(host(g.url))}</span>
      <span class="nw-go">开始玩 ↗</span>
    </a>`).join('');
  }

  async function init() {
    try {
      const res = await fetch('data/naiwa.json', { cache: 'no-store' });
      const json = await res.json();
      games = json.games || [];
      if (json.more) {
        document.getElementById('more').href = json.more.url;
        document.querySelector('#more strong').textContent = json.more.name;
      }
      render('');
    } catch (e) {
      grid.innerHTML = '<p class="nw-empty">游戏清单加载失败，刷新试试；也可以直接去 <a href="https://milkyfrog.com/games" target="_blank" rel="noopener noreferrer" style="color:var(--tf-cyan,#64e8ff)">官方合集页</a>。</p>';
    }
  }

  qEl.addEventListener('input', () => {
    clearTimeout(qEl._t);
    qEl._t = setTimeout(() => render(qEl.value), 200);
  });

  init();
})();
</script>
