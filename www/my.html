<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080d1b">
<title>我的 · 挞飞 TAFEI</title>
<meta name="description" content="挞飞 App 个人中心：账号、主题、更新检查与关于信息。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080d1b'/%3E%3Ctext x='32' y='43' font-size='34' font-family='Arial' font-weight='bold' fill='%2368dfff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root{
 --bg:#080d1b;--panel:rgba(17,29,55,.78);--line:rgba(130,170,255,.18);--line2:rgba(130,170,255,.34);
 --txt:#eef4ff;--muted:#9aaccb;--cyan:#64e8ff;--blue:#7297ff;--violet:#bd8cff;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
 margin:0;background:
  radial-gradient(62% 40% at 8% 0%,rgba(56,127,255,.2),transparent 70%),
  radial-gradient(52% 34% at 94% 4%,rgba(194,120,255,.14),transparent 70%),
  var(--bg);
 color:var(--txt);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 -webkit-font-smoothing:antialiased;min-height:100vh;
}
a{color:inherit;text-decoration:none}
.wrap{width:min(720px,calc(100% - 32px));margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px}
.brand{font-weight:900;letter-spacing:.13em;font-size:17px}
.brand span{color:var(--cyan)}
.top .hint{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
h1{margin:6px 0 12px;font-size:24px;letter-spacing:-.02em;font-weight:800}

/* 账号卡 */
.me{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;
 background:linear-gradient(150deg,rgba(39,74,140,.6),rgba(20,31,58,.72));
 border:1px solid var(--line2);box-shadow:0 14px 34px rgba(3,9,22,.4)}
.avatar{width:56px;height:56px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;
 font-size:20px;font-weight:900;color:#06101f;background:linear-gradient(135deg,#64e8ff,#7297ff 55%,#bd8cff)}
.me-main{flex:1;min-width:0}
.me-main b{display:block;font-size:16px;font-weight:800}
.me-main p{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
.me-btn{flex:0 0 auto;padding:9px 14px;border-radius:12px;font-size:12.5px;font-weight:800;color:#06101f;
 background:linear-gradient(120deg,#53ddff,#728cff 60%,#b28cff);border:0}

/* 数据条 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{padding:13px 10px;text-align:center;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.stat strong{display:block;font-size:17px;font-weight:800;color:var(--cyan);letter-spacing:.02em}
.stat span{font-size:11px;color:var(--muted)}

/* 分组列表 */
h2{margin:24px 0 10px;font-size:11.5px;letter-spacing:.18em;font-weight:800;color:var(--cyan)}
.list{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;font-size:13.5px;border-bottom:1px solid rgba(130,170,255,.12)}
.row:last-child{border-bottom:0}
.row .l{display:flex;align-items:center;gap:10px}
.row .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#06101f;background:linear-gradient(120deg,#53ddff,#728cff)}
.row .r{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.row:active{background:rgba(100,232,255,.06)}

/* 主题三选 */
.theme{display:flex;gap:8px;padding:14px 15px}
.theme button{flex:1;padding:10px 0;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.04);
 color:var(--txt);font-size:12.5px;font-weight:700}
.theme button.on{background:linear-gradient(120deg,rgba(83,221,255,.22),rgba(178,140,255,.22));border-color:rgba(100,232,255,.55);color:var(--cyan)}

/* 底部信息 */
.foot{padding:24px 0 10px;text-align:center;color:var(--muted);font-size:11px;line-height:1.8}
.pill{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);
 color:var(--cyan);font-size:10.5px;letter-spacing:.06em}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
 padding:10px 16px;border-radius:12px;background:rgba(10,18,34,.96);border:1px solid var(--line2);
 color:var(--txt);font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:9999}
.toast.show{opacity:1}
body.light{--bg:#f3f6fc;--panel:rgba(255,255,255,.92);--line:rgba(55,91,160,.16);--line2:rgba(55,91,160,.3);--txt:#16233c;--muted:#5f7291;--cyan:#0f9ec4}
</style>
<link rel="stylesheet" href="css/app-shell.css?v=3">
<link rel="stylesheet" href="css/tafei-ico.css?v=34">
<link rel="stylesheet" href="css/tafei-auth.css?v=43">
<script src="js/tafei-icons.js?v=34" defer></script>
<script src="js/app-shell.js?v=5" defer></script>
<script src="js/tafei-auth.js?v=43" defer></script>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">TAFEI<span>·挞飞</span></div>
    <div class="hint">个人中心</div>
  </header>

  <h1>我的</h1>

  <div class="me">
    <div class="avatar" id="avatar">访</div>
    <div class="me-main">
      <b id="nickname">未登录</b>
      <p id="meta">在社区页登录后可同步昵称、头像和额度</p>
    </div>
    <a class="me-btn" href="index.html#community">去社区</a>
  </div>

  <div class="stats">
    <a class="stat" href="index.html#community"><strong id="statPost">—</strong><span>我的帖子</span></a>
    <a class="stat" href="index.html#community"><strong id="statDm">—</strong><span>私信</span></a>
    <a class="stat" href="index.html#community"><strong id="statCredit">—</strong><span>额度</span></a>
  </div>

  <h2>外观</h2>
  <div class="list">
    <div class="theme" id="themeRow">
      <button type="button" data-theme="dark">深色</button>
      <button type="button" data-theme="light">浅色</button>
      <button type="button" data-theme="auto">跟随系统</button>
    </div>
  </div>

  <h2>应用</h2>
  <div class="list">
    <button class="row" type="button" id="btnCheck" style="width:100%;background:transparent;border:0;border-bottom:1px solid rgba(130,170,255,.12);color:inherit;text-align:left;font:inherit">
      <span class="l"><span class="dot" data-ti="update"></span><span>检查更新</span></span>
      <span class="r"><span id="verText">当前版本 —</span><span>›</span></span>
    </button>
    <a class="row" href="jingling.html"><span class="l"><span class="dot" data-ti="spirit"></span><span>精灵小屋</span></span><span class="r">去逛逛 ›</span></a>
    <a class="row" href="about.html"><span class="l"><span class="dot" data-ti="about"></span><span>关于挞飞</span></span><span class="r">›</span></a>
  </div>

  <div class="foot">
    挞飞 TAFEI · 安卓客户端<br>
    <span class="pill" id="verPill">v—</span>
    <div style="margin-top:8px">覆盖安装不会丢失数据；换签名需要先卸载旧版</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var NATIVE = window.TafeiNative || null;
  var verText = document.getElementById('verText');
  var verPill = document.getElementById('verPill');
  var toastEl = document.getElementById('toast');
  var toastTimer = 0;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  var ver = '';
  try { if (NATIVE && NATIVE.appVersion) ver = NATIVE.appVersion(); } catch (e) {}
  if (ver) {
    verText.textContent = '当前版本 v' + ver;
    verPill.textContent = 'v' + ver;
  } else {
    verText.textContent = '当前版本 v—';
    verPill.textContent = '网页预览';
  }

  var row = document.getElementById('themeRow');
  function currentTheme() {
    try { return localStorage.getItem('tafei-theme') || 'auto'; } catch (e) { return 'auto'; }
  }
  function paint() {
    var cur = currentTheme();
    var btns = row.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', btns[i].getAttribute('data-theme') === cur);
    }
    var light = cur === 'light' || (cur === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.body.classList.toggle('light', !!light);
    document.documentElement.style.colorScheme = light ? 'light' : 'dark';
  }
  row.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    var t = b.getAttribute('data-theme');
    try {
      if (t === 'auto') localStorage.removeItem('tafei-theme');
      else localStorage.setItem('tafei-theme', t);
    } catch (e2) {}
    paint();
    toast(t === 'auto' ? '已跟随系统外观' : (t === 'light' ? '已切换为浅色' : '已切换为深色'));
  });
  paint();

  document.getElementById('btnCheck').addEventListener('click', function () {
    if (NATIVE && NATIVE.checkUpdate) {
      toast('正在检查更新…');
      try { NATIVE.checkUpdate(); } catch (e) { toast('检查失败，请稍后再试'); }
    } else {
      toast('网页预览不支持，App 内可直接检查');
    }
  });
})();
</script>

</body>
</html>
