<script>
(function () {
  var rawPath;
  try { rawPath = decodeURIComponent(location.pathname || '/'); } catch (e) { rawPath = location.pathname || '/'; }
  var clean = rawPath.replace(/\/+$/, '');
  window.__nfPath = clean;
  var marker = '/tafei-site/';
  var base = clean.indexOf(marker) === 0 ? marker : clean.replace(/[^/]*$/, '');
  // 让 404 页面在深层路径下也能正确加载站内 CSS 和导航
  if (clean.indexOf(marker) === 0) document.write('<base href="' + marker + '">');
  var last = (clean.split('/').pop() || '').toLowerCase().replace(/\.html?$/, '');
  var MAP = {
    index: 'index.html', home: 'index.html', tafei: 'index.html', main: 'index.html', start: 'index.html',
    jingling: 'jingling.html', spirit: 'jingling.html', spirits: 'jingling.html', 'spirit-house': 'jingling.html',
    shop: 'shop.html', store: 'shop.html', mall: 'shop.html',
    service: 'service.html', services: 'service.html', tech: 'service.html',
    device: 'device.html', devices: 'device.html', models: 'device.html', phone: 'device.html',
    search: 'search.html', find: 'search.html',
    naiwa: 'naiwa.html', game: 'naiwa.html', games: 'naiwa.html',
    about: 'about.html', intro: 'about.html',
    angela: 'angela.html', xiaota: 'xiaota.html', fix: 'fix.html', care: 'fix.html', emergency: 'fix.html',
    community: 'index.html#community', shequ: 'index.html#community', hub: 'index.html#community', 'community-hub': 'index.html#community',
    articles: 'index.html#articles', article: 'index.html#articles',
    help: 'index.html#community', guestbook: 'index.html#community',
    messages: 'index.html#community', inbox: 'index.html#community'
  };
  var target = MAP[last];
  if (!target) return;
  var parts = target.split('#');
  var dest = base + parts[0] + location.search + (parts[1] ? '#' + parts[1] : '');
  if (dest !== rawPath + location.search && dest !== rawPath + location.search + (location.hash || '')) location.replace(dest);
})();
</script>

<script>
(() => {
  const form = document.getElementById('nfForm');
  const input = document.getElementById('nfQ');
  const pathEl = document.getElementById('nfPath');
  if (pathEl && window.__nfPath) pathEl.textContent = '你访问的是：' + window.__nfPath;
  if (input) {
    const last = decodeURIComponent(location.pathname || '').replace(/\/+$/, '').split('/').pop().toLowerCase().replace(/\.html?$/, '');
    if (last && last !== '404' && last.length <= 40) input.value = last;
  }
  if (!form || !input) return;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = (input.value || '').trim();
    location.href = q ? ('search.html?q=' + encodeURIComponent(q)) : 'search.html';
  });
})();
</script>
