name: deploy-v213

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-v213]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download package
        run: curl -L --fail -o /tmp/v213.zip "https://aka.doubaocdn.com/s/G7uCUkEXfu"
      - name: Unpack and verify
        run: |
          unzip -o /tmp/v213.zip -d .
          grep -q 'CONTENT STATION · 21.3' index.html
          grep -q 'id="shop"' index.html
          grep -q '手机权限' index.html
          test -f js/shop-view.js
      - name: Commit and push
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          git add index.html css/home.css js/shop-view.js js/home-views.js js/tafei-features.js data/articles.json js/articles.js service.html
          git commit -m "v21.3: 商城站内直通与手机权限栏目"
          git push origin HEAD:main
