name: deploy-spirit-v3b
on:
  push:
    paths:
      - '.github/workflows/deploy-spirit-v3b.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bump fix
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/QP47lTxiJE" -o /tmp/tafei-spirit-v3b.tar.gz
          tar -xzf /tmp/tafei-spirit-v3b.tar.gz -C .
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/spirit-core.js
          git commit -m "fix(spirit): 撞墙统计不触发挂件重绘"
          git push
      - name: Remove temp workflow
        run: |
          git rm .github/workflows/deploy-spirit-v3b.yml
          git commit -m "chore: 删除临时部署工作流 v3b"
          git push
