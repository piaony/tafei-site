name: deploy-fx-hint-v2
on:
  push:
    paths:
      - '.github/workflows/deploy-fx-hint-v2.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply package
        run: |
          curl -L --fail 'https://aka.doubaocdn.com/s/2aCYQ1Tg86' -o /tmp/fx.tgz
          tar -xzf /tmp/fx.tgz -C .
          git config user.name 'tafei-deploy'
          git config user.email 'tafei-deploy@users.noreply.github.com'
          git add index.html angela.html xiaota.html jingling.html js/jingling.js js/spirit-widget.js css/spirit-house.css css/partner-panel.css css/angela.css css/xiaota.css
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m 'fix: place spirit effect hints on all entry pages'; git push origin main; fi
