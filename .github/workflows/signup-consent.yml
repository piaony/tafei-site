name: signup-consent
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  ship:
    if: contains(github.event.head_commit.message, 'SIGNUP-CONSENT')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch files
        run: |
          curl -fsSL -o index.html "https://aka.doubaocdn.com/s/yTvTbIRwVN"
          curl -fsSL -o js/home-core.js "https://aka.doubaocdn.com/s/EriJLmYUsD"
          curl -fsSL -o css/home.css "https://aka.doubaocdn.com/s/AUn3aqMZOS"
          sed -i 's|href="css/home.css"|href="css/home.css?v=2"|' index.html
          sed -i 's|src="js/home-core.js"|src="js/home-core.js?v=2"|' index.html
          grep -n 'home.css\|home-core.js' index.html
          wc -c index.html js/home-core.js css/home.css
      - name: commit
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          rm -f .github/workflows/signup-consent.yml
          git add -A
          git commit -m "feat(auth): require community rules consent on signup, record agreed_at"
          git push
