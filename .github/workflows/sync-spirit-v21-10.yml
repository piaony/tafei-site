name: sync-spirit-v21-10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-spirit-v21-10.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'trigger sync v21.10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v21.10 files
        run: |
          set -e
          mkdir -p js css supabase
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/UyVZqD9xoi' -o js/spirit-core.js
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/OuVeU4Ux6S' -o js/jingling.js
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/ND2Q2VYI5C' -o css/spirit-house.css
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/snevOaQQjt' -o index.html
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/EjaDB0p7st' -o jingling.html
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/c4Li3WAns4' -o admin-center.html
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/6XVCCUT3dV' -o supabase/spirit_house.sql
          test -s js/spirit-core.js
          test -s js/jingling.js
          test -s css/spirit-house.css
          test -s index.html
          test -s jingling.html
          test -s admin-center.html
          test -s supabase/spirit_house.sql
      - name: Commit and push
        run: |
          set -e
          git config user.name 'tafei-sync-bot'
          git config user.email '3659229103@qq.com'
          git add js/spirit-core.js js/jingling.js css/spirit-house.css index.html jingling.html admin-center.html supabase/spirit_house.sql
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'v21.10 精灵商城逐款获取与后台发放'
          git push origin HEAD:main
