name: inbox-online
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  ship:
    if: contains(github.event.head_commit.message, 'INBOX-ONLINE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch inbox assets
        run: |
          mkdir -p css js data partials
          curl -fsSL -o js/tafei-inbox.js "https://aka.doubaocdn.com/s/85Px93GrHC"
          curl -fsSL -o css/tafei-inbox.css "https://aka.doubaocdn.com/s/RVD7DLCFQQ"
          curl -fsSL -o partials/info-center.html "https://aka.doubaocdn.com/s/h8riX4v5KM"
          curl -fsSL -o data/notices.json "https://aka.doubaocdn.com/s/C3NHrSkIh7"
          wc -c js/tafei-inbox.js css/tafei-inbox.css partials/info-center.html data/notices.json
      - name: inject info center
        run: python3 tools/inject_inbox.py .
      - name: commit and self-clean
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          rm -rf partials tools/inject_inbox.py .github/workflows/inbox-online.yml
          git add -A
          git commit -m "feat(inbox): info center with system notices, announcements and DMs"
          git push
