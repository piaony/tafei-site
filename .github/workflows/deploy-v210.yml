name: Deploy v21.0
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release files
        run: |
          set -e
          download() {
            url="$1"; out="$2"
            for i in 1 2 3; do
              if curl -L --fail --retry 2 --connect-timeout 12 "$url" -o "$out"; then return 0; fi
              sleep 2
              if curl -k -L --fail --retry 2 --connect-timeout 12 "$url" -o "$out"; then return 0; fi
              sleep 2
            done
            return 1
          }
          download "https://aka.doubaocdn.com/s/c4JteZcQsQ" "device.html"
          download "https://aka.doubaocdn.com/s/Mh4TJOounc" "index.html"
          download "https://aka.doubaocdn.com/s/ZN2porP2Oc" "data/devices.json"
          download "https://aka.doubaocdn.com/s/mxiC75skIU" "css/pages.css"
          download "https://aka.doubaocdn.com/s/bqAhKOqJpV" "search.html"
          test -s device.html && test -s index.html && test -s data/devices.json && test -s css/pages.css && test -s search.html
      - name: Verify SHA256
        run: |
          echo "56be7b526703c026a14ee0563f833ac289182599cb7f0d7f44fdae4e5110f6e4  device.html" | sha256sum -c -
          echo "e9451dfc09512590348399bdf712fe1d93f7cd5e77960c12eecb05371c76c9c5  index.html" | sha256sum -c -
          echo "4fdc805139c82b0731ed0fadf8bf9826c1d6d2216361c48d253db10cf60e469e  data/devices.json" | sha256sum -c -
          echo "c0338ad7abd9614ab57233683b0b9e13f5fa0bab5b24aae52c5c39522bfcf6df  css/pages.css" | sha256sum -c -
          echo "96fc0f00ffff46ee48fc552120e7b3d77810495e04305417aa542fd07ead770a  search.html" | sha256sum -c -
      - name: Commit and push
        run: |
          git config user.name "tafei-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add device.html index.html data/devices.json css/pages.css search.html
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "v21.0: 机型库扩容至145台（4深度+141官方规格）"
          git push origin main
