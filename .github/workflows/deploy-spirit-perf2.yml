name: Deploy Spirit Perf WebP
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download package
        run: curl -L --retry 3 -o /tmp/site.tar.gz 'https://aka.doubaocdn.com/s/WjuV62jqzc'
      - name: Extract package
        run: tar -xzf /tmp/site.tar.gz
      - name: Commit and push
        run: |
          rm -f .github/workflows/deploy-spirit-perf2.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: use webp grid and avatar images'
          git push
