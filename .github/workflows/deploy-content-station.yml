name: deploy-content-station
run-name: "[auto-deploy v20] content station"
on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-content-station.yml"]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify artifacts
        run: |
          set -euo pipefail
          mkdir -p js css data
          fetch() { curl -fsSL "$1" -o "$2"; echo "$3  $2" | sha256sum -c -; }
          fetch "https://aka.doubaocdn.com/s/lWXNiWmWK9" index.html a39b07fee3d0339c1c7dd8db665ff4202aee55b6a4e157b775216471e6fe3ea6
          fetch "https://aka.doubaocdn.com/s/Lf98PyYAYF" js/articles.js d9027fc48318bb0adbd1b3d81428456d447cef460c29976881837da009007c08
          fetch "https://aka.doubaocdn.com/s/kyXZsZgM16" js/home-views.js 08b43b68514b87e36a705b55cbe3a4126395b25040b7ec45d4fc7bb0775dad41
          fetch "https://aka.doubaocdn.com/s/zzNauaOaCZ" css/articles.css 3eecd36097e0e92363273a9cc71a5d3448a7e86322b3cccbb3bd5d63b100c7a9
          fetch "https://aka.doubaocdn.com/s/P5B9Sn77Bo" data/articles.json 70e55646aebb8bafba65acd2416b0fc88311843c0072a6c15281424515ec18c8
          fetch "https://aka.doubaocdn.com/s/51lqgireH2" robots.txt 6df169c7aab6f3f0968107bc55bc81ff0e6983e86cb6ded7e81323a8b585c0f6
          fetch "https://aka.doubaocdn.com/s/FMM3UUWpzh" sitemap.xml 92719dcce92db92e3c116612b01cc5ba19ee8474fe3e3af6c235321483eda9a6
      - name: Commit and push
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          git add index.html js/articles.js js/home-views.js css/articles.css data/articles.json robots.txt sitemap.xml
          git rm -f .github/workflows/deploy-content-station.yml
          git commit -m "[auto-deploy v20] 内容站改造：双栏目文章系统、6 篇范文、SEO 基建与更新日志 [CONTENT-STATION-V20]"
          git push
