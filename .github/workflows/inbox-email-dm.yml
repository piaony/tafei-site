name: inbox-email-dm
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  ship:
    if: contains(github.event.head_commit.message, 'INBOX-EMAIL-DM')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch files
        run: |
          curl -fsSL -o js/tafei-inbox.js "https://aka.doubaocdn.com/s/0QuKswUitd"
          curl -fsSL -o css/tafei-inbox.css "https://aka.doubaocdn.com/s/DfrHW7RRE5"
          mkdir -p supabase
          curl -fsSL -o supabase/dm_email_lookup.sql "https://aka.doubaocdn.com/s/jMYXjjacWR"
          sed -i 's|js/tafei-inbox.js?v=2|js/tafei-inbox.js?v=3|' index.html
          sed -i 's|css/tafei-inbox.css?v=2|css/tafei-inbox.css?v=3|' index.html
          grep -n 'tafei-inbox' index.html
          wc -c js/tafei-inbox.js css/tafei-inbox.css supabase/dm_email_lookup.sql
      - name: commit
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          rm -f .github/workflows/inbox-email-dm.yml
          git add -A
          git commit -m "feat(inbox): start DM only by exact recipient email, drop member picker"
          git push
