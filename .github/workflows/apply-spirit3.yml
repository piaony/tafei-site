name: Apply spirit3 patch

on:
  push:
    paths:
      - .github/workflows/apply-spirit3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v170 source patch
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/zfICdUdrSD" -o /tmp/spirit3.patch
          wc -c /tmp/spirit3.patch
          git apply --check --binary -p1 /tmp/spirit3.patch
          git apply --binary -p1 /tmp/spirit3.patch
          git fetch origin app/capacitor-setup
          git reset --mixed FETCH_HEAD
          git checkout FETCH_HEAD -- .github/workflows/apply-spirit3.yml
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(spirit): 8-frame walk atlas, motion state machine, power-aware pause" || true
          git push origin HEAD:app/capacitor-setup
