name: v170 patch debug

on:
  push:
    paths:
      - .github/workflows/apply-spirit3.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe patch
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/zfICdUdrSD" -o /tmp/spirit3.patch
          echo "::notice::patch_bytes=$(wc -c < /tmp/spirit3.patch)"
          head -c 80 /tmp/spirit3.patch | tr '\n' ' '
          echo
          if ! git apply --check --binary -p1 /tmp/spirit3.patch 2>/tmp/apply.err; then
            ERR=$(tr '\n' ' ' < /tmp/apply.err | cut -c1-900)
            echo "::error::check_failed ${ERR}"
            exit 1
          fi
          echo "::notice::check_ok"
