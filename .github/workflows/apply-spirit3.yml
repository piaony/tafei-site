name: Apply spirit3 patch

on:
  push:
    paths:
      - .github/workflows/apply-spirit3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v171 compile fix
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/pkd0uFSbLB" -o /tmp/fix.patch
          wc -c /tmp/fix.patch
          git apply --check -p1 /tmp/fix.patch
          git apply -p1 /tmp/fix.patch
          git reset --mixed HEAD
          git fetch origin app/capacitor-setup
          git reset --mixed FETCH_HEAD
          git checkout FETCH_HEAD -- .github/workflows/apply-spirit3.yml
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(spirit): avoid float dp lossy conversion" || true
          git push origin HEAD:app/capacitor-setup
