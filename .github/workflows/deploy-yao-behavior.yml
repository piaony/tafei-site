name: Deploy Yao Behavior v16
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download package
        run: curl -L --retry 3 -o /tmp/site.tar.gz 'https://aka.doubaocdn.com/s/ugUPXJMXm9'
      - name: Extract package
        run: tar -xzf /tmp/site.tar.gz
      - name: Commit and push
        run: |
          rm -f .github/workflows/deploy-yao-behavior.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 强化瑶的动作与表情 v16'
          git push
