name: Deploy skin picker
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-skin-picker.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch package
        run: |
          curl -L --fail --retry 3 -o /tmp/tafei-skin-picker.tar.gz "https://aka.doubaocdn.com/s/BIWIsk8Juc"
      - name: Apply package
        run: |
          tar -xzf /tmp/tafei-skin-picker.tar.gz -C .
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          git add jingling.html js/jingling.js css/spirit-house.css
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feat: add extensible spirit skin picker"
          git push origin HEAD:main
