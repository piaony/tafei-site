name: deploy-once
on:
  push:
    paths:
      - '.deploy-trigger'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download package
        run: curl -L --fail -o /tmp/v215.zip "https://aka.doubaocdn.com/s/ICMv2tKeVz"
      - name: Unpack and verify
        run: |
          unzip -o /tmp/v215.zip -d .
          grep -q 'CONTENT STATION · 21.5' index.html
          python3 -c "import json; d=json.load(open('data/devices.json')); assert len(d['devices'])+len(d['catalog'])==425"
      - name: Commit and push
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          git add -A
          git commit -m "v21.5: 机型库扩容到 425 台，覆盖 24 个品牌" || echo "no changes"
          git push origin HEAD:main
