name: deploy-avatar-fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[avatar-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download package
        run: curl -L --fail -o /tmp/fix.zip "https://aka.doubaocdn.com/s/OaTHLaMkiV"
      - name: Unpack and verify
        run: |
          unzip -o /tmp/fix.zip -d .
          grep -q 'return=representation' js/home-core.js
          grep -q 'on_conflict=id' js/home-core.js
      - name: Commit and push
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          git add index.html js/home-core.js
          git commit -m "fix: 头像云端写入校验与资料行自愈"
          git push origin HEAD:main
