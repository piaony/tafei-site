name: Sync UI patch into repo

on:
  push:
    paths:
      - .github/workflows/ui-patch-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch assets
        run: |
          set -e
          mkdir -p patches
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/VlXQXmoXdp" -o patches/v85-living-yao.patch
          wc -c patches/v85-living-yao.patch
          if ! git apply --check -p1 patches/v85-living-yao.patch; then
            echo "::error::v85 living yao patch cannot apply"
            exit 1
          fi
          echo "patch check ok"

      - name: Commit and push
        run: |
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add patches/v85-living-yao.patch
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(ci): v85 living Yao overlay patch"
            git push origin HEAD:app/capacitor-setup
          fi
