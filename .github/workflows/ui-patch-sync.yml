name: Sync UI patch into repo

on:
  push:
    paths:
      - .github/workflows/ui-patch-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply spirit upgrade batch 1
        run: |
          set -e
          if grep -q "PREF_ROOT_GLOBAL" android/app/src/main/java/com/piaony/tafei/SpiritOverlayService.java 2>/dev/null; then
            echo "spirit upgrade already present"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/d8lqcIk7Vs" -o /tmp/spirit1.patch
          wc -c /tmp/spirit1.patch
          git apply --check -p1 /tmp/spirit1.patch
          git apply -p1 /tmp/spirit1.patch
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add android/app/src/main/java/com/piaony/tafei/MainActivity.java \
            android/app/src/main/java/com/piaony/tafei/SpiritAccessibilityService.java \
            android/app/src/main/java/com/piaony/tafei/SpiritDesktopActions.java \
            android/app/src/main/java/com/piaony/tafei/SpiritOverlayService.java \
            www/jingling.html www/js/jingling.js
          git commit -m "feat(spirit): root global layer, icon avoidance, pickup gesture"
          git push origin HEAD:app/capacitor-setup
