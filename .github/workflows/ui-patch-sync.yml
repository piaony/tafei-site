name: Sync UI patch into repo

on:
  push:
    paths:
      - .github/workflows/ui-patch-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply v145 move verification patch
        run: |
          set -e
          if grep -q "cellPoint" android/app/src/main/java/com/piaony/tafei/SpiritDesktopActions.java 2>/dev/null; then
            echo "v145 move verification already present"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/qcVpsLQihQ" -o /tmp/v145.patch
          wc -c /tmp/v145.patch
          git apply --check -p1 /tmp/v145.patch
          git apply -p1 /tmp/v145.patch
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add android/app/src/main/java/com/piaony/tafei/MainActivity.java \
            android/app/src/main/java/com/piaony/tafei/SpiritDesktopActions.java \
            android/app/src/main/java/com/piaony/tafei/SpiritOverlayService.java \
            www/jingling.html www/js/jingling.js
          git commit -m "fix(app): verify desktop move and anchor targets"
          git push origin HEAD:app/capacitor-setup
