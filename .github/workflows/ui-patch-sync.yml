name: Sync UI patch into repo

on:
  push:
    paths:
      - .github/workflows/ui-patch-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply v143 home-before-action patch
        run: |
          set -e
          if grep -q "Intent home" android/app/src/main/java/com/piaony/tafei/SpiritDesktopActions.java 2>/dev/null; then
            echo "v143 home-before-action already present"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/a0O1Yx5GLy" -o /tmp/v143.patch
          wc -c /tmp/v143.patch
          git apply --check -p1 /tmp/v143.patch
          git apply -p1 /tmp/v143.patch
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add android/app/src/main/java/com/piaony/tafei/SpiritDesktopActions.java
          git commit -m "fix(app): return home before accessibility action"
          git push origin HEAD:app/capacitor-setup
