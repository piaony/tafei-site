name: Sync UI patch into repo

on:
  push:
    paths:
      - .github/workflows/ui-patch-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply v132 UI patch
        run: |
          set -e
          if grep -q "desktopManagerSection" www/jingling.html 2>/dev/null; then
            echo "v132 UI already present"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/2dsXvDALBU" -o /tmp/v132-ui.patch
          wc -c /tmp/v132-ui.patch
          git apply --check -p1 /tmp/v132-ui.patch
          git apply -p1 /tmp/v132-ui.patch
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add www/jingling.html www/css/spirit-house.css www/js/jingling.js
          git commit -m "feat(app): v132 desktop manager visible"
          git push origin HEAD:app/capacitor-setup
