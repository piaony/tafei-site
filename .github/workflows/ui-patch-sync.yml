name: Sync UI patch into repo

on:
  push:
    paths:
      - .github/workflows/ui-patch-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply v146 action poll delay
        run: |
          set -e
          if grep -q "var poll = function" www/js/jingling.js 2>/dev/null; then
            echo "v146 poll fix already present"
            exit 0
          fi
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/Xc74esZWjI" -o /tmp/v146.patch
          wc -c /tmp/v146.patch
          git apply --check -p1 /tmp/v146.patch
          git apply -p1 /tmp/v146.patch
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add www/jingling.html www/js/jingling.js
          git commit -m "fix(app): avoid stale action success before service starts"
          git push origin HEAD:app/capacitor-setup
