name: Sync UI patch into repo

on:
  push:
    paths:
      - .github/workflows/ui-patch-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch assets
        run: |
          set -e
          mkdir -p patches www/js
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/5CkJ9fzRiq" -o patches/v54-redesign.patch
          wc -c patches/v54-redesign.patch
          if ! git apply --check -p1 patches/v54-redesign.patch; then
            echo "::error::patch 无法应用，请检查基线"
            exit 1
          fi
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/UoAahzcUOH" -o patches/v62-shop-feed.patch
          wc -c patches/v62-shop-feed.patch
          if ! git apply --check -p1 patches/v62-shop-feed.patch; then
            echo "::error::v62 补丁无法应用，请检查基线"
            exit 1
          fi
          echo "patch check ok"

      - name: Commit and push
        run: |
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add patches/v54-redesign.patch patches/v62-shop-feed.patch
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(ci): site redesign + shop feed patch"
            git push origin HEAD:app/capacitor-setup
          fi
