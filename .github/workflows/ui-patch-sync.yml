name: Sync UI patch into repo

on:
  push:
    paths:
      - .github/workflows/ui-patch-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download v131 patch
        run: |
          set -e
          mkdir -p patches
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/kAGvK7nUEG" -o patches/v131-desktop-manager.patch
          wc -c patches/v131-desktop-manager.patch
          git apply --check -p1 patches/v131-desktop-manager.patch
          echo "v131 patch check ok"

      - name: Commit and push patch
        run: |
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add patches/v131-desktop-manager.patch
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(ci): add v131 desktop manager patch"
            git push origin HEAD:app/capacitor-setup
          fi
