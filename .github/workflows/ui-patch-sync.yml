name: Sync UI patch into repo

on:
  push:
    paths:
      - .github/workflows/ui-patch-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch assets
        run: |
          set -e
          mkdir -p patches www/js
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/Brc64pV0UQ" -o patches/v48-spirit-growth.patch
          curl -fsSL --retry 3 --retry-delay 2 "https://aka.doubaocdn.com/s/kwrqxxtU0p" -o www/js/spirit-growth.js
          wc -c patches/v48-spirit-growth.patch www/js/spirit-growth.js
          node --check www/js/spirit-growth.js
          if ! git apply --check -p1 patches/v48-spirit-growth.patch; then
            echo "::error::patch 无法应用，请检查基线"
            exit 1
          fi
          echo "patch check ok"

      - name: Commit and push
        run: |
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add patches/v48-spirit-growth.patch www/js/spirit-growth.js
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(ci): spirit growth stage 2"
            git push origin HEAD:app/capacitor-setup
          fi
