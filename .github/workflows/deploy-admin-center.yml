name: deploy-admin-center
run-name: deploy-admin-center-${{ github.run_id }}

on:
  push:
    paths:
      - '.github/workflows/deploy-admin-center.yml'

permissions:
  contents: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-admin-center]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download from CDN
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 2 -o admin-center.html "https://aka.doubaocdn.com/s/yE4s914s0Z"
          curl -fsSL --retry 3 --retry-delay 2 -o admin.html "https://aka.doubaocdn.com/s/hgypeEUejT"
          curl -fsSL --retry 3 --retry-delay 2 -o admin-audit.html "https://aka.doubaocdn.com/s/M1PjdSnEsK"
          curl -fsSL --retry 3 --retry-delay 2 -o service-admin.html "https://aka.doubaocdn.com/s/f9cuUcwJjY"
          curl -fsSL --retry 3 --retry-delay 2 -o service.html "https://aka.doubaocdn.com/s/8LYqJrNCdO"
          curl -fsSL --retry 3 --retry-delay 2 -o js/tafei-features.js "https://aka.doubaocdn.com/s/cEXOIw5q9j"
          ls -l admin-center.html admin.html admin-audit.html service-admin.html service.html js/tafei-features.js

      - name: Verify bytes
        run: |
          set -e
          cat > /tmp/SHA256SUMS <<'EOF'
          9d371039f1c3d3c6b32698210ae67c1ad5b3737b169bf774c415531943f0c596  admin-center.html
          3fae5e399d047bc3fecad6f129b284f68258c8e6da7f4251d0b99034517f9ac5  admin.html
          3fae5e399d047bc3fecad6f129b284f68258c8e6da7f4251d0b99034517f9ac5  admin-audit.html
          3fae5e399d047bc3fecad6f129b284f68258c8e6da7f4251d0b99034517f9ac5  service-admin.html
          d7f910a2226f8e706b2ce82e0f4b262077cb68dd38a5a82fc7d660488368dee4  service.html
          9e6793e6fa4b0567bdfa92accbfec0c05af36847a62f2bd8999466a1ecc3a7c3  js/tafei-features.js
          EOF
          sha256sum -c /tmp/SHA256SUMS

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "tafei-bot"
          git config user.email "3659229103@qq.com"
          git rm -q .github/workflows/deploy-admin-center.yml
          git add admin-center.html admin.html admin-audit.html service-admin.html service.html js/tafei-features.js
          git commit -m "feat(admin): unified console for booking/accounts/dm/store/notices [deploy-admin-center]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
