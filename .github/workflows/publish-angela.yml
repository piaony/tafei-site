name: Publish Angela companion assets

on:
  push:
    paths:
      - '.github/workflows/publish-angela.yml'

permissions:
  contents: write

concurrency:
  group: publish-angela
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download package
        run: |
          curl -L --fail --retry 3 -o /tmp/tafei-angela-v23.tar.gz "https://aka.doubaocdn.com/s/kyRivRXLjo"
          echo "db24effb07c6a92599ff7ad5c78a5553785f786dcddb34c2b3b8c4c39ea0a1ed  /tmp/tafei-angela-v23.tar.gz" | sha256sum -c -

      - name: Extract package
        run: tar -xzf /tmp/tafei-angela-v23.tar.gz

      - name: Commit and push
        run: |
          git config user.name "tafei-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add index.html angela.html xiaota.html jingling.html js/spirit-core.js js/spirit-widget.js js/tafei-ui.js assets/spirits/angela-v23
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "feat: add Angela companion expressions and actions"
          git push origin HEAD:main
