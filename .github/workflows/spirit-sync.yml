name: Sync spirit house patch

on:
  push:
    paths:
      - .github/workflows/spirit-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          curl -fsSL --retry 3 "https://aka.doubaocdn.com/s/BLBqnUyJlG" -o /tmp/spirit.patch
          git apply -p1 /tmp/spirit.patch
      - name: Commit
        run: |
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add css/spirit-house.css jingling.html
          git commit -m "fix: single column spirit layout for narrow screens"
          git push origin HEAD:main
