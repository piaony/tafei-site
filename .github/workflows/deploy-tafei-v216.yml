name: deploy-tafei-v216
on:
  push:
    paths:
      - '.deploy-v216'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v21.6 package
        run: curl -fL -o /tmp/site.zip 'https://aka.doubaocdn.com/s/fIcwqeFTqF'
      - name: Unpack package
        run: unzip -o /tmp/site.zip -d /tmp/site
      - name: Copy changed files
        run: |
          cp /tmp/site/admin-center.html admin-center.html
          cp /tmp/site/index.html index.html
          cp /tmp/site/css/home.css css/home.css
          cp /tmp/site/js/community-hub.js js/community-hub.js
          cp /tmp/site/js/home-core.js js/home-core.js
          cp /tmp/site/js/mobile-nav.js js/mobile-nav.js
      - name: Commit and push
        run: |
          git config user.name 'tafei-deploy-bot'
          git config user.email 'actions@github.com'
          git add admin-center.html index.html css/home.css js/community-hub.js js/home-core.js js/mobile-nav.js
          if git diff --cached --quiet; then echo 'No changes to commit'; exit 0; fi
          git commit -m 'v21.6 站长后台与站点彻底融合'
          git push
