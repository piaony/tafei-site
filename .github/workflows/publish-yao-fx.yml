name: Publish Yao interaction effects

on:
  push:
    paths:
      - '.github/workflows/publish-yao-fx.yml'

permissions:
  contents: write

concurrency:
  group: publish-yao-fx
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download package
        run: |
          curl -L --fail --retry 3 -o /tmp/tafei-yao-fx.tar.gz "https://aka.doubaocdn.com/s/kugJGUPWZo"
          echo "c8a33132ddc7560ef073ddefabbdd701e5e402aad243d79752388026eb9a4eb4  /tmp/tafei-yao-fx.tar.gz" | sha256sum -c -

      - name: Extract package
        run: tar -xzf /tmp/tafei-yao-fx.tar.gz

      - name: Commit and push
        run: |
          git config user.name "tafei-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add index.html angela.html xiaota.html jingling.html js/spirit-core.js js/spirit-widget.js js/tafei-ui.js css/spirit-widget.css assets/spirits/yao-v23
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "feat: add Yao drag collision and dizzy feedback"
          git push origin HEAD:main
