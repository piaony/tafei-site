name: Publish Yao Time Wish assets

on:
  push:
    paths:
      - '.github/workflows/publish-yao.yml'

permissions:
  contents: write

concurrency:
  group: publish-yao
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download package
        run: |
          curl -L --fail --retry 3 -o /tmp/tafei-yao-v23.tar.gz "https://aka.doubaocdn.com/s/yV06yjwSao"
          echo "8a246fd7b8ba90be7b62cd54a96ea9cb35ed31ea68796bd31589e08ac6235b29  /tmp/tafei-yao-v23.tar.gz" | sha256sum -c -

      - name: Extract package
        run: tar -xzf /tmp/tafei-yao-v23.tar.gz

      - name: Commit and push
        run: |
          git config user.name "tafei-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add index.html angela.html xiaota.html jingling.html js/spirit-core.js js/tafei-ui.js assets/spirits/yao-v23
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "feat: upgrade Yao to Time Wish companion assets"
          git push origin HEAD:main
