name: announcement-fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/announcement-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed announcement
        shell: bash
        run: |
          set -e
          curl -k -L --retry 5 --retry-delay 3 'https://aka.doubaocdn.com/s/zlyikFOXLm' -o /tmp/announcement.tgz
          tar -xzf /tmp/announcement.tgz -C .
          grep -q '本地先确认并关闭' announcement.js
          sed -i 's|<script src="announcement.js"></script>|<script src="announcement.js?v=23"></script>|' index.html
          grep -q 'announcement.js?v=23' index.html
          git config user.name 'tafei-sync-bot'
          git config user.email '3659229103@qq.com'
          git add announcement.js index.html
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m 'fix: announcement confirm no longer blocks'
          git push origin HEAD:main
