name: tafei-app-shell-v2
on:
  push:
    paths:
      - '.github/workflows/app-shell-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bump shell version
        run: |
          python3 - <<'PY'
          import glob
          reps = [('app-shell.css?v=1', 'app-shell.css?v=2'), ('app-shell.js?v=1', 'app-shell.js?v=2')]
          total = 0
          for p in sorted(glob.glob('www/*.html')):
              if p.split('/')[-1].startswith('admin'):
                  continue
              s = open(p, encoding='utf-8').read()
              o = s
              for a, b in reps:
                  s = s.replace(a, b)
              if s != o:
                  open(p, 'w', encoding='utf-8').write(s)
                  total += 1
                  print('bumped', p)
          print('total', total)
          PY
      - name: commit
        run: |
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A www
          git commit -m "feat(app): App 外壳 v2（默认深色 + 导航浅色适配）" || echo "nothing to commit"
          git push
