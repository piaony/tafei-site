name: sync-xiaota

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-xiaota.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'trigger xiaota sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing xiaota files
        run: |
          set -e
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/FFs8nsl2Bb' -o xiaota.html
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/GvxLPY7bzU' -o css/xiaota.css
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/KfeXt4GVpb' -o css/spirit-widget.css
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/xFbEnvTjol' -o css/spirit-chat.css
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/nwg16VzqUI' -o css/partner-panel.css
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/cHukAVHvDu' -o js/xiaota-pet.js
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/HT93lS2eqF' -o js/spirit-widget.js
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/omCnSxOoUq' -o js/spirit-chat.js
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/7Ble3mluwO' -o assets/spirits/xiaota.jpg
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/0BRjEgmiTV' -o assets/spirits/tanluning-uniform.jpg
          test -s xiaota.html
          test -s css/xiaota.css
          test -s js/xiaota-pet.js
          test -s assets/spirits/xiaota.jpg
      - name: Commit and push
        run: |
          set -e
          git config user.name 'tafei-sync-bot'
          git config user.email '3659229103@qq.com'
          git add xiaota.html css/xiaota.css css/spirit-widget.css css/spirit-chat.css css/partner-panel.css js/xiaota-pet.js js/spirit-widget.js js/spirit-chat.js assets/spirits/xiaota.jpg assets/spirits/tanluning-uniform.jpg
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'fix: publish missing xiaota page assets'
          git push origin HEAD:main
