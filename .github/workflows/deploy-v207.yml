name: deploy-v207
run-name: deploy-v207-${{ github.run_id }}

on:
  push:
    paths:
      - .github/workflows/deploy-v207.yml

permissions:
  contents: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-v207]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch files with fallbacks
        run: |
          set -e
          python3 - <<'PY'
          import hashlib, ssl, time, urllib.parse, urllib.request
          FILES = {
            'device.html': ('https://aka.doubaocdn.com/s/1tFHSseSw6', 'd64bdd6e09013722a783eae1b50682ecd1fd6169431f85f7f0cd5da67684a24d'),
            'index.html': ('https://aka.doubaocdn.com/s/vtnKm9NOrW', '519717fd218dc7399bafafbd656bdec95425245b8708686843b16838cedfe174'),
            'naiwa.html': ('https://aka.doubaocdn.com/s/iPKbzGqTRC', '9fd6d4f8a4eb46816a9773aafd695b749b732bd31594e327865a6097f5939bba'),
            'search.html': ('https://aka.doubaocdn.com/s/hmXKwO8n89', '19de30ea50a229564ca893700907d603640f4e94eb8a04ca320b9c504d510679'),
            'service.html': ('https://aka.doubaocdn.com/s/Ry5YlvoQVy', 'd1e792286562cc5c58712091515d62527e672e62a8956aba1addaf766698dfb3'),
            'shop.html': ('https://aka.doubaocdn.com/s/5Tk85npNPn', 'ca5cfd1fd9ca18d48f64d845f16123507a00a33d7b1aecc86487f9ed03891884'),
            'css/pages.css': ('https://aka.doubaocdn.com/s/aa2C9mTeIx', '61e2d9ed5176d17eafddcd11b7fcc393df63b6245e8e0ebaabfda2321732a738'),
            'data/devices.json': ('https://aka.doubaocdn.com/s/sGzCPs7SQP', 'a18c09b122d38b4a9c6c24885967d9e64be459b180be14695198e343f93293d1'),
            'data/articles.json': ('https://aka.doubaocdn.com/s/agedI8Uz0q', '7c7cc62878298b4beddcf1cebea06435ff0f81a769a7c65c13422e0218ff2acb'),
            'js/home-views.js': ('https://aka.doubaocdn.com/s/jgw3dV5ADP', '2864c9acd6c2aafd6120257504c1fd034df199242f2692a6a2d4a60429ea0814'),
            '404.html': ('https://aka.doubaocdn.com/s/kmUZ6gMDLd', '44cf188f5b0b6672db42b2ec7ce5999ab493ccca2ceb8db7ae12c70d6be9d78e'),
          }

          def fetch(url, insecure=False, proxy=None, timeout=30):
              target = 'https://api.allorigins.win/raw?url=' + urllib.parse.quote(url, safe='') if proxy else url
              ctx = ssl.create_default_context()
              if insecure:
                  ctx.check_hostname = False
                  ctx.verify_mode = ssl.CERT_NONE
              req = urllib.request.Request(target, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as r:
                  return r.read()

          methods = [('direct', {}), ('insecure', {'insecure': True}), ('allorigins', {'proxy': True})]
          diag = []
          ok = True
          for path, (url, sha) in FILES.items():
              got = None
              for attempt in range(3):
                  for name, kw in methods:
                      try:
                          data = fetch(url, **kw)
                          h = hashlib.sha256(data).hexdigest()
                          status = 'OK' if h == sha else 'HASH-MISMATCH'
                          diag.append('%s | %s | try%d | %d bytes | %s | %s' % (path, name, attempt + 1, len(data), h[:12], status))
                          if h == sha:
                              got = data
                              break
                      except Exception as e:
                          diag.append('%s | %s | try%d | ERR %s: %s' % (path, name, attempt + 1, type(e).__name__, str(e)[:160]))
                  if got is not None:
                      break
                  time.sleep(4)
              if got is None:
                  ok = False
                  continue
              open(path, 'wb').write(got)

          open('/tmp/diag.txt', 'w').write(chr(10).join(diag))
          print(chr(10).join(diag))
          if ok:
              open('/tmp/site-ok', 'w').write('ok')
          PY

      - name: Deploy or report
        run: |
          set -e
          git config user.name 'tafei-bot'
          git config user.email '3659229103@qq.com'
          if [ -f /tmp/site-ok ]; then
            git add device.html index.html naiwa.html search.html service.html shop.html css/pages.css data/devices.json data/articles.json js/home-views.js 404.html
            git commit -m 'deploy: v20.7 机型库对比与404 [deploy-v207]'
            git push origin HEAD:main
          else
            cp /tmp/diag.txt diag-v207.txt
            git add diag-v207.txt
            git commit -m 'diag: v20.7 retry probe [deploy-v207]'
            git push origin HEAD:main
          fi
