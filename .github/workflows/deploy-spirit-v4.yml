name: deploy-spirit-v4
on:
  push:
    paths:
      - '.github/workflows/deploy-spirit-v4.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply drag fix package
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/jp8WvDHlBe" -o /tmp/tafei-spirit-v4.tar.gz
          tar -xzf /tmp/tafei-spirit-v4.tar.gz -C .
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(spirit): 修复拖拽落点被状态回写覆盖"
          git push
      - name: Remove temp workflow
        run: |
          git rm .github/workflows/deploy-spirit-v4.yml
          git commit -m "chore: 删除临时部署工作流 v4"
          git push
