name: inbox-css-fix
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  ship:
    if: contains(github.event.head_commit.message, 'INBOX-CSS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch css
        run: |
          curl -fsSL -o css/tafei-inbox.css "https://aka.doubaocdn.com/s/tMa6TU0hfT"
          sed -i 's|href="css/tafei-inbox.css"|href="css/tafei-inbox.css?v=2"|' index.html
          grep -n 'tafei-inbox.css' index.html
          wc -c css/tafei-inbox.css
      - name: commit
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          rm -f .github/workflows/inbox-css-fix.yml
          git add -A
          git commit -m "fix(inbox): mobile tab bar fits 360-390px, cache-bust css"
          git push
