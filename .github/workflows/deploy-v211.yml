name: Deploy v21.1
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download v21.1 archive
        run: |
          set -e
          curl -L --fail --retry 3 --connect-timeout 15 "https://aka.doubaocdn.com/s/dmsx8IlQVl" -o /tmp/tafei-v211.tar.gz
          echo "3284e9d6724139d7c075624b6b8ac7bca706bbe381f8396af88f52a561d3cd78  /tmp/tafei-v211.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tafei-v211.tar.gz
          test -s index.html && test -s service.html && test -s js/tafei-inbox.js && test -s js/home-core.js
      - name: Commit changed files
        run: |
          git config user.name "tafei-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service.html shop.html device.html search.html naiwa.html about.html css/home.css css/tafei-inbox.css css/pages.css js/home-core.js js/tafei-inbox.js js/community-help.js
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "v21.1: 站长直连、额度展示与官方保障"
          git push origin main
