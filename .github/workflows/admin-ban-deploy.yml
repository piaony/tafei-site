name: admin-ban-deploy
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  ship:
    if: contains(github.event.head_commit.message, 'ADMIN-BAN')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch files
        run: |
          curl -fsSL -o admin-audit.html "https://aka.doubaocdn.com/s/AZ6nmDpUb2"
          mkdir -p supabase
          curl -fsSL -o supabase/admin_ban.sql "https://aka.doubaocdn.com/s/mdV5k1UU4P"
          wc -c admin-audit.html supabase/admin_ban.sql
      - name: commit
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          rm -f .github/workflows/admin-ban-deploy.yml
          git add -A
          git commit -m "feat(admin): ban and unban accounts from audit page"
          git push
