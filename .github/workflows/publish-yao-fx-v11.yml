name: Publish Yao interaction effects v11

on:
  push:
    paths:
      - '.github/workflows/publish-yao-fx-v11.yml'

permissions:
  contents: write

concurrency:
  group: publish-yao-fx-v11
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download package
        run: |
          curl -L --fail --retry 3 -o /tmp/tafei-yao-fx-v11.tar.gz "https://aka.doubaocdn.com/s/GeANeZXP7T"
          echo "888f6522778480b43736762f64e1b6c3337e70ca997855d1a227f2802297f74e  /tmp/tafei-yao-fx-v11.tar.gz" | sha256sum -c -

      - name: Extract package
        run: tar -xzf /tmp/tafei-yao-fx-v11.tar.gz

      - name: Commit and push
        run: |
          git config user.name "tafei-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add index.html angela.html xiaota.html jingling.html js/spirit-core.js js/spirit-widget.js js/tafei-ui.js css/spirit-widget.css assets/spirits/yao-v23
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "fix: keep top edge for summit hint, widget v11"
          git push origin HEAD:main
