name: deploy-walk5
on:
  push:
    paths:
      - '.github/workflows/deploy-walk5.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply package
        run: |
          curl -L --fail 'https://aka.doubaocdn.com/s/PqCl7VB34c' -o /tmp/walk5.tgz
          tar -xzf /tmp/walk5.tgz -C .
          git config user.name 'tafei-deploy'
          git config user.email 'tafei-deploy@users.noreply.github.com'
          git add index.html angela.html xiaota.html jingling.html js/spirit-widget.js
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m 'feat: auto walk every five seconds'; git push origin main; fi
