name: fix-polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed fix.html
        shell: bash
        run: |
          set -e
          curl -k -L --retry 5 --retry-delay 3 'https://aka.doubaocdn.com/s/gFhXjMVi63' -o /tmp/fix.tgz
          tar -xzf /tmp/fix.tgz -C .
          grep -q 'scroll-margin-top:88px' fix.html
          git config user.name 'tafei-sync-bot'
          git config user.email '3659229103@qq.com'
          git add fix.html
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m 'polish: keep fix result title below header'
          git push origin HEAD:main
