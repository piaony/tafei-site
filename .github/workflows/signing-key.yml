name: tafei-signing-key
on:
  push:
    paths:
      - '.github/workflows/signing-key.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch key
        run: |
          mkdir -p android/signing
          curl --max-time 60 --retry 3 --retry-all-errors -fsSL https://paste.rs/5mCwF -o android/signing/hobby-key.b64
          wc -c android/signing/hobby-key.b64
          base64 -d android/signing/hobby-key.b64 > /tmp/k.jks
          keytool -list -keystore /tmp/k.jks -storepass android | tail -3
      - name: commit
        run: |
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add android/signing/hobby-key.b64
          git commit -m "chore(android): 导入仓库内通用签名钥匙"
          git push
