name: tafei-design-bootstrap
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  bootstrap:
    if: contains(github.event.head_commit.message, 'BOOTSTRAP-DESIGN-LAYER')
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: run migration
        run: python3 .github/scripts/inject.py
      - name: commit and self-clean
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "TAFEI 20.0: wire design layer (auto migration)"
          rm -f .github/workflows/tafei-design-bootstrap.yml
          rm -f .github/scripts/inject.py
          git add -A
          git commit -m "chore: remove one-shot migration script" || true
          git push
