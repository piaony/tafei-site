name: Build TAFEI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - app/capacitor-setup

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Probe Android SDK
        run: |
          mkdir -p ci-logs
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          {
            echo "SDK=$SDK"
            ls -1 "$SDK" || true
            echo "--- cmdline-tools"
            ls -1 "$SDK/cmdline-tools" || true
          } 2>&1 | tee ci-logs/probe.log
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        run: |
          mkdir -p ci-logs
          command -v sdkmanager || { echo "sdkmanager NOT FOUND"; exit 1; }
          {
            yes | sdkmanager --licenses || true
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          } 2>&1 | tee ci-logs/sdkmanager.log

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "signed=none" >> "$GITHUB_ENV"
          KS="android/ci-signing.jks"
          rm -f "$KS"
          got=""
          if [ -n "$KS_PASS" ] && [ -f android/signing/release.jks.enc.b64 ]; then
            if base64 -d android/signing/release.jks.enc.b64 > android/ci-signing.enc 2>/dev/null \
               && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
                    -in android/ci-signing.enc -out "$KS" -pass env:KS_PASS 2>/dev/null; then
              got="库存加密密钥"
            fi
          fi
          if [ -z "$got" ] && [ -n "$KS_B64" ]; then
            if printf '%s' "$KS_B64" | base64 -d > "$KS" 2>/dev/null; then got="仓库 Secret"; fi
          fi
          if [ -n "$got" ]; then
            PASS="$KS_PASS"
            [ -z "$PASS" ] && PASS="Tafei2026ReleaseKey"
            if keytool -list -keystore "$KS" -storepass "$PASS" > /dev/null 2>&1; then
              ALIAS="${KS_ALIAS}"
              if [ -z "$ALIAS" ]; then
                ALIAS=$(keytool -list -keystore "$KS" -storepass "$PASS" 2>/dev/null \
                  | awk -F, '/PrivateKeyEntry/ {print $1; exit}' | tr -d ' ')
              fi
              [ -z "$ALIAS" ] && ALIAS="tafei_release"
              KPASS="${KS_KEYPASS:-$PASS}"
              echo "TAFEI_KEYSTORE=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"
              echo "TAFEI_KEYPASS=$KPASS" >> "$GITHUB_ENV"
              echo "TAFEI_ALIAS=$ALIAS" >> "$GITHUB_ENV"
              echo "signed=formal" >> "$GITHUB_ENV"
              echo "签名来源：正式密钥（$got），别名 $ALIAS"
              keytool -list -v -keystore "$KS" -storepass "$PASS" \
                | grep -E "Alias name|SHA256:|Valid from:" | head -4 || true
            else
              echo "::error::密钥库密码不正确，正式签名密钥无法解锁"
              exit 1
            fi
          elif [ -f android/signing/hobby-key.b64 ]; then
            base64 -d android/signing/hobby-key.b64 > "$KS"
            keytool -list -keystore "$KS" -storepass android | tail -2
            echo "TAFEI_KEYSTORE=$GITHUB_WORKSPACE/$KS" >> "$GITHUB_ENV"
            echo "TAFEI_KEYPASS=android" >> "$GITHUB_ENV"
            echo "TAFEI_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "signed=hobby" >> "$GITHUB_ENV"
            echo "::warning::未配置正式签名，本次使用仓库内通用钥匙，产物不会发布为 Release"
          else
            echo "::warning::没有任何签名密钥，本次只产出未签名包"
          fi

      - name: Install npm dependencies
        run: |
          mkdir -p ci-logs
          set -o pipefail
          npm ci 2>&1 | tee ci-logs/npm.log

      - name: Fetch UI assets (v34 home + icon system)
        run: |
          set -e
          get() { curl -fsSL --retry 3 --retry-delay 2 "$1" -o "$2"; echo "fetched $2 ($(wc -c < "$2") bytes)"; }
          need() {
            if [ -s "$1" ] && grep -q -- "$2" "$1"; then
              echo "keep  $1"
            else
              get "$3" "$1"
            fi
          }
          need www/index.html "hv-grid" "https://aka.doubaocdn.com/s/jokMfuHTGY"
          need www/my.html "tafei-ico.css" "https://aka.doubaocdn.com/s/Da4Nn0ykcX"
          need www/app-more.html 'data-ti="fix"' "https://aka.doubaocdn.com/s/JNoelDqQMU"
          need www/css/tafei-ico.css "TAFEI ICON SYSTEM" "https://aka.doubaocdn.com/s/AdC27wTarP"
          need www/css/home-v2.css ".hv-acc" "https://aka.doubaocdn.com/s/As9UMPaQzm"
          need www/js/tafei-icons.js "TafeiIcons" "https://aka.doubaocdn.com/s/JZgj6jaUdC"
          need www/js/home-v2.js "TafeiHome" "https://aka.doubaocdn.com/s/gxIg2pljH1"
          need www/js/my-account.js 'data-ti="feedback"' "https://aka.doubaocdn.com/s/s3G3rVGqNv"
          grep -q "hv-grid" www/index.html
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A www
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): sync v34 ui assets [skip ci]"
            git push origin HEAD:app/capacitor-setup || true
          fi

      - name: Fetch spirit2 patch
        run: |
          mkdir -p patches
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://aka.doubaocdn.com/s/PPOzIxtazo" -o patches/spirit2.patch
          wc -c patches/spirit2.patch

      - name: Apply source patches
        run: |
          shopt -s nullglob
          applied=0
          for p in patches/*.patch; do
            if git apply --check -p1 "$p" 2>/dev/null; then
              git apply -p1 "$p" && echo "applied $p" && applied=1
            else
              echo "skip $p (already applied or not applicable)"
            fi
          done
          if [ "$applied" = "1" ]; then
            git config user.name "tafei-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A www android patches
            git commit -m "chore(ci): apply source patches [skip ci]" || true
            git push origin HEAD:app/capacitor-setup || true
          fi

      - name: Bump app shell asset version
        run: |
          SHELL_VER="${{ github.run_number }}"
          python3 - "$SHELL_VER" <<'PY'
          import glob, sys
          ver = sys.argv[1]
          import re
          PAT = re.compile(r"((?:css|js)/(?:app-shell\.css|app-shell\.js|tafei-ico\.css|tafei-icons\.js|home-v2\.css|home-v2\.js)\?v=)[0-9A-Za-z.]+")
          for f in glob.glob("www/*.html"):
              s = open(f, encoding="utf-8").read()
              s = PAT.sub(lambda m: m.group(1) + ver, s)
              open(f, "w", encoding="utf-8").write(s)
          print("shell asset version ->", ver)
          PY
          sed -i -E "s#(spirit-widget-menu\.js\?v=)[0-9A-Za-z]+#\1${SHELL_VER}#g" www/js/app-shell.js
          sed -i -E "s#(spirit-widget\.js\?v=)[0-9]+#\1${SHELL_VER}#g" www/js/app-shell.js
          grep -o "spirit-widget[a-z-]*\.js?v=[0-9A-Za-z]*" www/js/app-shell.js | sort -u

      - name: Convert app images to WebP
        continue-on-error: true
        run: |
          mkdir -p ci-logs
          : > ci-logs/webp.log
          python3 -c "import PIL; print('PIL ready', PIL.__version__)" >> ci-logs/webp.log 2>&1 || python3 -m pip install --quiet pillow >> ci-logs/webp.log 2>&1 || echo "PIL INSTALL FAILED" | tee -a ci-logs/webp.log
          cat > /tmp/tafei_webp.py <<'PYFILE'
          import sys, os
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          src = sys.argv[1]
          dst = os.path.splitext(src)[0] + ".webp"
          im = Image.open(src)
          im.load()
          w, h = im.size
          if max(w, h) > 1800:
              im.thumbnail((1800, 1800), Image.LANCZOS)
          if im.mode not in ("RGB", "RGBA"):
              im = im.convert("RGBA" if "A" in im.getbands() or im.mode == "P" else "RGB")
          im.save(dst, "WEBP", quality=80, method=4)
          print("ok %s %dx%d -> %dKB" % (src, im.size[0], im.size[1], os.path.getsize(dst) // 1024))
          PYFILE

          find www -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | sort > /tmp/imgs.txt
          echo "candidates: $(wc -l < /tmp/imgs.txt)" | tee -a ci-logs/webp.log
          ok=0; fail=0
          while IFS= read -r f; do
            if python3 /tmp/tafei_webp.py "$f" >> ci-logs/webp.log 2>&1; then
              ok=$((ok+1))
            else
              echo "FAIL $f" | tee -a ci-logs/webp.log
              fail=$((fail+1))
            fi
          done < /tmp/imgs.txt
          echo "webp convert ok=$ok fail=$fail" | tee -a ci-logs/webp.log
          if [ "$ok" -lt 1 ]; then
            echo "no image converted, skip link rewrite to avoid broken refs" | tee -a ci-logs/webp.log
            exit 1
          fi

          python3 - <<'PYLINK'
          import os, re
          ROOT = "www"
          EXT = (".png", ".jpg", ".jpeg")
          TEXT = (".html", ".css", ".js", ".json", ".md", ".xml")
          pat = re.compile(r"[^\s\"'()<>,;:]+\.(png|jpg|jpeg)(?![A-Za-z0-9])", re.I)

          def has(p):
              return os.path.isfile(p)

          webbase = set()
          for dp, _, fs in os.walk(ROOT):
              for fn in fs:
                  if fn.lower().endswith(".webp"):
                      webbase.add(fn.lower())

          def repl(m, dp=""):
              tok = m.group(0)
              cut = max(tok.rfind("."), 0)
              new = tok[:cut] + ".webp"
              base = new.split("/")[-1].lower()
              if base in webbase:
                  return new
              if has(os.path.join(ROOT, new)) or has(os.path.join(dp, new)):
                  return new
              return tok

          texts = []
          rewritten = 0
          for dp, _, fs in os.walk(ROOT):
              for fn in fs:
                  if not fn.lower().endswith(TEXT):
                      continue
                  p = os.path.join(dp, fn)
                  try:
                      s = open(p, encoding="utf-8").read()
                  except Exception:
                      continue
                  ns = pat.sub(lambda m: repl(m, dp), s)
                  if ns != s:
                      open(p, "w", encoding="utf-8").write(ns)
                      rewritten += 1
                  texts.append(ns)

                  blob = "\n".join(texts)

          fixed = 0
          for dp, _, fs in os.walk(ROOT):
              for fn in fs:
                  if not fn.lower().endswith(".js"):
                      continue
                  p = os.path.join(dp, fn)
                  s = open(p, encoding="utf-8").read()
                  ns = s.replace(r"/\.png($|\?)/i", r"/\.(png|webp)($|\?)/i")
                  if ns != s:
                      open(p, "w", encoding="utf-8").write(ns)
                      fixed += 1

          removed = 0
          kept = 0
          for dp, _, fs in os.walk(ROOT):
              for fn in fs:
                  if not fn.lower().endswith(EXT):
                      continue
                  src = os.path.join(dp, fn)
                  web = os.path.splitext(src)[0] + ".webp"
                  if not has(web):
                      continue
                  if fn in blob:
                      kept += 1
                      continue
                  os.remove(src)
                  removed += 1

          left = 0
          for dp, _, fs in os.walk(ROOT):
              for fn in fs:
                  if fn.lower().endswith(".webp"):
                      left += 1
          print("refs rewritten in %d files; removed %d originals; kept %d still referenced; webp total %d" % (rewritten, removed, kept, left))
          PYLINK

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bump version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle | head -4

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee ../ci-logs/gradle-build.log

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/
          ls -lh out
          sha256sum out/*.apk | tee ci-logs/apk-sha256.txt
          if [ "$(ls out/*.apk | head -1)" != "out/app-release.apk" ]; then mv "$(ls out/*.apk | head -1)" out/app-release.apk; fi
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tafei-release-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: env.signed == 'formal'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: TAFEI 安卓包 v${{ github.run_number }}
          make_latest: true
          body: |
            挞飞 TAFEI 安卓客户端（Capacitor 封装，站点离线快照）。

            - versionCode ${{ github.run_number }}
            - versionName 1.0.${{ github.run_number }}
            - 正式签名（别名 tafei_release），同包名可直接覆盖升级；从测试签名包切换请先卸载旧版
            - 安装前允许「安装未知来源」

            下载：直接点下方 app-release.apk。
          files: out/app-release.apk

      - name: Publish build logs
        if: always()
        run: |
          mkdir -p ci-logs
          {
            echo "run=${{ github.run_number }} sha=${{ github.sha }}"
            echo "--- git status"
            git status --short | head -50
          } 2>&1 | tee ci-logs/env.log || true
          ls -la ci-logs || true
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          (git switch -c ci-log 2>/dev/null || git switch -C ci-log 2>/dev/null || true)
          git add -f -A ci-logs
          git commit -m "ci: android build logs" || true
          git push -f origin ci-log || true
          echo "push-done"
