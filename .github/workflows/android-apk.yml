name: Build TAFEI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - app/capacitor-setup

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Probe Android SDK
        run: |
          mkdir -p ci-logs
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          {
            echo "SDK=$SDK"
            ls -1 "$SDK" || true
            echo "--- cmdline-tools"
            ls -1 "$SDK/cmdline-tools" || true
          } 2>&1 | tee ci-logs/probe.log
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        run: |
          mkdir -p ci-logs
          command -v sdkmanager || { echo "sdkmanager NOT FOUND"; exit 1; }
          {
            yes | sdkmanager --licenses || true
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          } 2>&1 | tee ci-logs/sdkmanager.log

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "signed=false" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > android/ci-signing.jks
            keytool -list -keystore android/ci-signing.jks -storepass Tafei2026ReleaseKey | tail -2
            echo "TAFEI_KEYSTORE=$GITHUB_WORKSPACE/android/ci-signing.jks" >> "$GITHUB_ENV"
            echo "TAFEI_KEYPASS=Tafei2026ReleaseKey" >> "$GITHUB_ENV"
            echo "TAFEI_ALIAS=tafei" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_ENV"
            echo "签名来源：仓库 Secret"
          elif [ -f android/signing/hobby-key.b64 ]; then
            base64 -d android/signing/hobby-key.b64 > android/ci-signing.jks
            keytool -list -keystore android/ci-signing.jks -storepass android | tail -2
            echo "TAFEI_KEYSTORE=$GITHUB_WORKSPACE/android/ci-signing.jks" >> "$GITHUB_ENV"
            echo "TAFEI_KEYPASS=android" >> "$GITHUB_ENV"
            echo "TAFEI_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_ENV"
            echo "::warning::未配置 ANDROID_KEYSTORE_B64，本次使用仓库内通用签名钥匙（可覆盖升级，但同签名可被伪造）"
          else
            echo "::warning::没有任何签名密钥，本次只产出未签名包"
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Bump app shell asset version
        run: |
          SHELL_VER="${{ github.run_number }}"
          python3 - "$SHELL_VER" <<'PY'
          import glob, sys
          ver = sys.argv[1]
          for f in glob.glob("www/*.html"):
              s = open(f, encoding="utf-8").read()
              for pref in ("css/app-shell.css?v=", "js/app-shell.js?v="):
                  for old in ("2", "3"):
                      s = s.replace(pref + old, pref + ver)
              open(f, "w", encoding="utf-8").write(s)
          print("shell asset version ->", ver)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bump version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle | head -4

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/
          ls -lh out
          sha256sum out/*.apk | tee ci-logs/apk-sha256.txt
          if [ "$(ls out/*.apk | head -1)" != "out/app-release.apk" ]; then mv "$(ls out/*.apk | head -1)" out/app-release.apk; fi
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tafei-release-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: env.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: TAFEI 安卓包 v${{ github.run_number }}
          make_latest: true
          body: |
            挞飞 TAFEI 安卓客户端（Capacitor 封装，站点离线快照）。

            - versionCode ${{ github.run_number }}
            - versionName 1.0.${{ github.run_number }}
            - 安装前允许「安装未知来源」；覆盖升级需与上一版同签名

            下载：直接点下方 app-release.apk。
          files: out/app-release.apk

      - name: Commit build logs on failure
        if: failure()
        run: |
          set -x
          ls -la ci-logs || true
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git switch -c ci-log
          git add -A ci-logs
          git commit -m "ci: android build logs" || true
          git push -f origin ci-log || true
          echo "push-done"
