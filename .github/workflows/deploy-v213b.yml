name: deploy-v213b

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-v213b]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download package
        run: curl -L --fail -o /tmp/v213b.zip "https://aka.doubaocdn.com/s/Xyv2oV33Yo"
      - name: Unpack and verify
        run: |
          unzip -o /tmp/v213b.zip -d .
          grep -q 'shop-view-open' js/home-views.js
          grep -q 'home.css?v=10' index.html
      - name: Commit and push
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          git add index.html css/home.css js/home-views.js
          git commit -m "polish: 商城视图隐藏搜索浮钮"
          git push origin HEAD:main
