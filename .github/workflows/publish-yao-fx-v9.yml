name: Publish Yao interaction effects v9

on:
  push:
    paths:
      - '.github/workflows/publish-yao-fx-v9.yml'

permissions:
  contents: write

concurrency:
  group: publish-yao-fx-v9
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download package
        run: |
          curl -L --fail --retry 3 -o /tmp/tafei-yao-fx-v9.tar.gz "https://aka.doubaocdn.com/s/7GD6kOJwQT"
          echo "42699df96229380f9baf08df2225f6ac6d48ad321580f2a5ca1cba8f0c1622a8  /tmp/tafei-yao-fx-v9.tar.gz" | sha256sum -c -

      - name: Extract package
        run: tar -xzf /tmp/tafei-yao-fx-v9.tar.gz

      - name: Commit and push
        run: |
          git config user.name "tafei-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add index.html angela.html xiaota.html jingling.html js/spirit-core.js js/spirit-widget.js js/tafei-ui.js css/spirit-widget.css assets/spirits/yao-v23
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "fix: add star burst on Yao wall hit, widget v9"
          git push origin HEAD:main
