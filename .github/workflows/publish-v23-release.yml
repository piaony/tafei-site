name: Publish v23 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v23-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release payload
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/8H14st9Vw5" -o /tmp/tafei-v23-release.tar.gz
          echo "057c81a9290830616807c909c66b9280088f20f22d52e93b8755b6542ab8e702  /tmp/tafei-v23-release.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tafei-v23-release.tar.gz -C .

      - name: Commit v23 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html jingling.html xiaota.html angela.html css js assets/spirits/xiaota-v23
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "feat: v23.0 官方小挞飞与自由切换魔法伙伴"
          git push
