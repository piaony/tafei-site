name: Publish v23 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v23-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release payload
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/fLK9ynvmQW" -o /tmp/tafei-v23-hotfix.tar.gz
          echo "01d7388154d72bb74144a0c24ea9e0f2738fe43f5fa0625a80d6ee2fdfbb2f80  /tmp/tafei-v23-hotfix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tafei-v23-hotfix.tar.gz -C .
          rm -f assets/spirits/xiaota-v23/memorial-blank.png

      - name: Commit v23 hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jingling.html js/jingling.js assets/spirits/xiaota-v23
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "perf: compress v23 memorial background and bump cache"
          git push
