name: inbox-dm-fix
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  ship:
    if: contains(github.event.head_commit.message, 'INBOX-DMFIX')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch dm send
        run: |
          curl -fsSL -o js/tafei-inbox.js "https://aka.doubaocdn.com/s/EEWADpTvz8"
          sed -i 's|src="js/tafei-inbox.js" defer|src="js/tafei-inbox.js?v=2" defer|' index.html
          grep -n 'tafei-inbox.js' index.html
          wc -c js/tafei-inbox.js
      - name: commit
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          rm -f .github/workflows/inbox-dm-fix.yml
          git add -A
          git commit -m "fix(inbox): thread composer sends to current peer"
          git push
