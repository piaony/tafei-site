name: deploy-spirit-v3
on:
  push:
    paths:
      - '.github/workflows/deploy-spirit-v3.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply package
        run: |
          curl -fsSL "https://aka.doubaocdn.com/s/4VQrBBK9zz" -o /tmp/tafei-spirit-v3.tar.gz
          tar -xzf /tmp/tafei-spirit-v3.tar.gz -C .
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(spirit): v23.2 陪伴足迹、成就与移除双击入口"
            git push
          fi
      - name: Remove temp workflow
        run: |
          git rm .github/workflows/deploy-spirit-v3.yml
          git commit -m "chore: 删除临时部署工作流"
          git push
