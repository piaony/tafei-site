name: Publish widget wording fix

on:
  push:
    paths:
      - '.github/workflows/publish-widget-wording.yml'

permissions:
  contents: write

concurrency:
  group: publish-widget-wording
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download package
        run: |
          curl -L --fail --retry 3 -o /tmp/tafei-widget-v6b.tar.gz "https://aka.doubaocdn.com/s/LTvLxwUbfa"
          echo "3630cdf414bc2e24cec311034ccd96a9b5b8c607c6bf8b49740b0b5e0f44ad1c  /tmp/tafei-widget-v6b.tar.gz" | sha256sum -c -

      - name: Extract package
        run: tar -xzf /tmp/tafei-widget-v6b.tar.gz

      - name: Commit and push
        run: |
          git config user.name "tafei-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add index.html angela.html xiaota.html jingling.html js/tafei-ui.js js/spirit-core.js js/spirit-widget.js js/jingling.js css/spirit-widget.css
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "fix: align companion wording and bust core cache"
          git push origin HEAD:main
