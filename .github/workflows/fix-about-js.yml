name: fix-about-js
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'FIX-ABOUT-JS')
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: patch about.html
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("about.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("st.a + ')' + ';", "st.a + ')';")
          tail_bad = "    requestAnimationFrame(draw);\n  }\n}\n</script>"
          tail_ok = "    requestAnimationFrame(draw);\n  }\n</script>"
          s = s.replace(tail_bad, tail_ok)
          p.write_text(s, encoding="utf-8")
          PY
      - name: commit and self-clean
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          rm -f .github/workflows/fix-about-js.yml
          git add -A
          git commit -m "fix(about): repair starfield script and remove fixer"
          git push
