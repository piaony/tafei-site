name: sync-404-copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-404-copy.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'trigger 404 copy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 404 page
        run: |
          set -e
          curl -fsSL --retry 3 'https://aka.doubaocdn.com/s/sfjZNNeLzd' -o 404.html
          test -s 404.html
          grep -q 'nfPath' 404.html
      - name: Commit and push
        run: |
          set -e
          git config user.name 'tafei-sync-bot'
          git config user.email '3659229103@qq.com'
          git add 404.html
          if git diff --cached --quiet; then
            echo 'no changes'
            exit 0
          fi
          git commit -m 'fix: clarify 404 recovery hint'
          git push origin HEAD:main
