name: deploy-v213c

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-v213c]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download package
        run: curl -L --fail -o /tmp/v213c.zip "https://aka.doubaocdn.com/s/VipvXRkhor"
      - name: Unpack and verify
        run: |
          unzip -o /tmp/v213c.zip -d .
          grep -q '<strong>21.3</strong>当前网站版本' index.html
      - name: Commit and push
        run: |
          git config user.name "tafei-bot"
          git config user.email "tafei-bot@users.noreply.github.com"
          git add index.html
          git commit -m "chore: 版本号更新为 21.3"
          git push origin HEAD:main
