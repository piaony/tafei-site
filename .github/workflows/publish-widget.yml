name: Publish widget v6

on:
  push:
    paths:
      - '.github/workflows/publish-widget.yml'

permissions:
  contents: write

concurrency:
  group: publish-widget-v6
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download package
        run: |
          curl -L --fail --retry 3 -o /tmp/tafei-widget-v6.tar.gz "https://aka.doubaocdn.com/s/dLvA8IbsqN"
          echo "2bf735a2687f6f9692d31e98095912b61952228467be0a62a02546038f49a155  /tmp/tafei-widget-v6.tar.gz" | sha256sum -c -

      - name: Extract package
        run: tar -xzf /tmp/tafei-widget-v6.tar.gz

      - name: Commit and push
        run: |
          git config user.name "tafei-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add index.html angela.html xiaota.html jingling.html js/tafei-ui.js js/spirit-core.js js/spirit-widget.js js/jingling.js css/spirit-widget.css
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "feat: upgrade site companion to draggable autonomous v6"
          git push origin HEAD:main
