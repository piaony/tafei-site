name: deploy-nav
run-name: deploy-nav-${{ github.run_id }}

on:
  push:
    paths:
      - '.github/workflows/deploy-nav.yml'

permissions:
  contents: write

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-nav]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download from CDN
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 2 -o index.html "https://aka.doubaocdn.com/s/9klO5lB4CL"
          curl -fsSL --retry 3 --retry-delay 2 -o css/pages.css "https://aka.doubaocdn.com/s/1upYibwpPH"
          curl -fsSL --retry 3 --retry-delay 2 -o device.html "https://aka.doubaocdn.com/s/bQMUPDBD8J"
          curl -fsSL --retry 3 --retry-delay 2 -o service.html "https://aka.doubaocdn.com/s/x2fTLMsd2b"
          curl -fsSL --retry 3 --retry-delay 2 -o shop.html "https://aka.doubaocdn.com/s/BZ8VMSNVPr"
          curl -fsSL --retry 3 --retry-delay 2 -o search.html "https://aka.doubaocdn.com/s/iWjQkYG8pk"

      - name: Verify bytes
        run: |
          set -e
          cat > /tmp/SHA256SUMS <<'EOF'
          89bb11de46bec4822cbb21269d7c7886e8e47c37f187b06cc5039dc962b716ce  index.html
          1ee8942d37f4c8f60c26675628e1d69bab10e6d5407beeb99a0e2131ce44ca23  css/pages.css
          120e45613adf48195ed70fe63daf6e48f7f383bbedb5c46947e9c8dd6c858c10  device.html
          583dc09c7049431fa22b71eb6f4bbe835a9b1efc914f707a80db7aa9e1bf5745  service.html
          3548c84576c3a846f3587ebb99941e4248006dbf93488e032b6e5c7076baa7dc  shop.html
          8cbd91e6d46c8c880aa4aa2b82c6037655db3045e3a6eeeadff69113a5853864  search.html
          EOF
          sha256sum -c /tmp/SHA256SUMS

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "tafei-bot"
          git config user.email "3659229103@qq.com"
          git rm -q .github/workflows/deploy-nav.yml
          git add index.html css/pages.css device.html service.html shop.html search.html
          git commit -m "feat(nav): unified inner-page nav + tight mobile bar (v20.6) [deploy-nav]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
