name: Publish Yao interaction effects v10

on:
  push:
    paths:
      - '.github/workflows/publish-yao-fx-v10.yml'

permissions:
  contents: write

concurrency:
  group: publish-yao-fx-v10
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download package
        run: |
          curl -L --fail --retry 3 -o /tmp/tafei-yao-fx-v10.tar.gz "https://aka.doubaocdn.com/s/U8ZDP6bAro"
          echo "540e87f79700d26961ccc0975e92e971d9c17193d3ad01ad954b6d6e8cd17fea  /tmp/tafei-yao-fx-v10.tar.gz" | sha256sum -c -

      - name: Extract package
        run: tar -xzf /tmp/tafei-yao-fx-v10.tar.gz

      - name: Commit and push
        run: |
          git config user.name "tafei-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add index.html angela.html xiaota.html jingling.html js/spirit-core.js js/spirit-widget.js js/tafei-ui.js css/spirit-widget.css assets/spirits/yao-v23
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "style: brighten Yao interaction particles, widget v10"
          git push origin HEAD:main
