name: tafei-asset-sync
on:
  push:
    paths:
      - '.github/workflows/tafei-asset-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch files
        run: |
          set -euo pipefail
          mkdir -p assets/spirits/yao-art
          curl -fsSL "https://aka.doubaocdn.com/s/bzU3Sp8n5l" -o assets/spirits/yao-art/main.svg
          curl -fsSL "https://aka.doubaocdn.com/s/3ueqR8Srpf" -o assets/spirits/yao-art/avatar.svg
          curl -fsSL "https://aka.doubaocdn.com/s/6ARrAVqUBE" -o assets/spirits/yao-art/widget-128.svg
          curl -fsSL "https://aka.doubaocdn.com/s/qfsBJqGjwN" -o js/spirit-core.js
          curl -fsSL "https://aka.doubaocdn.com/s/n1Oj2BnEJ9" -o js/spirit-widget.js
      - name: verify
        run: |
          set -euo pipefail
          ls -la assets/spirits/yao-art
          grep -c "yao-art" js/spirit-core.js
          grep -c "skin.actionDir !== undefined" js/spirit-widget.js
          git status --short
      - name: commit
        run: |
          set -euo pipefail
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(spirit): 瑶·时之祈愿 原画皮肤（SVG 立绘 + 头像 + 挂件）v23.1"
          git push
