name: tafei-asset-sync
on:
  push:
    paths:
      - '.github/workflows/tafei-asset-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch files
        run: |
          set -euo pipefail
          mkdir -p assets/spirits/yao-art
          C="curl --max-time 45 --retry 3 --retry-all-errors -fsSL"
          $C "https://paste.rs/bzU" -o /dev/null || true
          $C "https://paste.rs/vZwNk" -o assets/spirits/yao-art/main.svg
          $C "https://paste.rs/XaF6b" -o assets/spirits/yao-art/avatar.svg
          $C "https://paste.rs/t0sTw" -o assets/spirits/yao-art/widget-128.svg
          $C "https://paste.rs/s0bzb" -o js/spirit-core.js
          $C "https://paste.rs/9q31P" -o js/spirit-widget.js
          wc -c assets/spirits/yao-art/*.svg js/spirit-core.js js/spirit-widget.js
      - name: verify
        run: |
          set -euo pipefail
          grep -c "yao-art" js/spirit-core.js
          grep -c "skin.actionDir !== undefined" js/spirit-widget.js
          grep -c "<svg" assets/spirits/yao-art/main.svg
          test "$(wc -c < assets/spirits/yao-art/main.svg)" -gt 30000
          test "$(wc -c < assets/spirits/yao-art/avatar.svg)" -gt 20000
          test "$(wc -c < assets/spirits/yao-art/widget-128.svg)" -gt 4000
          test "$(wc -c < js/spirit-widget.js)" -gt 30000
          git status --short
      - name: commit
        run: |
          set -euo pipefail
          git config user.name "tafei-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(spirit): 瑶·时之祈愿 原画皮肤（SVG 立绘 + 头像 + 扳件）v23.1"
          git pull --rebase origin main
          git push
