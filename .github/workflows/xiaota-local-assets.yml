name: xiaota-local-assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xiaota-local-assets.yml'

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point xiaota to repo assets
        shell: bash
        run: |
          set -e
          sed -i 's|https://aka.doubaocdn.com/s/GvxLPY7bzU|css/xiaota.css?v=2|' xiaota.html
          sed -i 's|https://aka.doubaocdn.com/s/cHukAVHvDu|js/xiaota-pet.js?v=2|' xiaota.html
          grep -q 'css/xiaota.css?v=2' xiaota.html
          grep -q 'js/xiaota-pet.js?v=2' xiaota.html
          git config user.name 'tafei-sync-bot'
          git config user.email '3659229103@qq.com'
          git add xiaota.html
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m 'chore: use local xiaota assets'
          git push origin HEAD:main
