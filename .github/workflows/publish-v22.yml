name: publish-v22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v22.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch v22 bundle
        shell: bash
        run: |
          set -e
          curl -kfsSL --connect-timeout 15 --max-time 90 --retry 2 'https://aka.doubaocdn.com/s/qZSxYZdf4J' -o /tmp/v22.tgz
          tar tzf /tmp/v22.tgz
          tar xzf /tmp/v22.tgz -C .
          test -s fix.html
          grep -q 'TAFEI CARE' fix.html
          grep -q 'fix.html' index.html
      - name: Commit and push
        shell: bash
        run: |
          set -e
          git config user.name 'tafei-sync-bot'
          git config user.email '3659229103@qq.com'
          git add fix.html index.html service.html 404.html sitemap.xml
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m 'feat: v22 telephone care room'
          git push origin HEAD:main
